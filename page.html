// ---- 日用品（记录每件日用品的成本，按"元/天"估算与校准；分类别 + 按平均计） ----
let dEditId=null, dPrice='', dBuy='', dEnd='', dEst='', dCat='护肤品', dAvg=false;
let dCatFilter='全部';
const DAILY_CAT_PRESET=['护肤品','化妆品','洗漱用品','文具'];
function dailyDone(name){
  return (S.dailies||[]).filter(d=>d.name===name&&d.endDate);
}
// 同款历史基准：所有已用完记录的实际日均 算术平均（够客观即可）
function dailyBaseline(name){
  const done=dailyDone(name);
  if(!done.length)return null;
  const per=done.map(d=>{const ds=daysBetween(d.buyDate,d.endDate);return ds>0?d.price/ds:d.price;});
  return {avg:per.reduce((a,b)=>a+b,0)/per.length,count:per.length};
}
// 计算一件日用品当前的展示信息（明确区分 实际/基准/预估/临时/待平均）
function dailyCalc(d){
  if(d.avgOnly){
    const base=dailyBaseline(d.name);
    if(base)return {kind:'实际',perDay:base.avg,count:base.count,avgOnly:true};
    const ds=Math.max(1,daysBetween(d.buyDate,todayStr()));
    return {kind:'实际',perDay:d.price/ds,avgOnly:true,tempAvg:true};
  }
  if(d.endDate){
    const ds=daysBetween(d.buyDate,d.endDate);
    return {kind:'实际',perDay:ds>0?d.price/ds:d.price,days:ds,end:d.endDate};
  }
  const base=dailyBaseline(d.name);
  const t=todayStr();
  if(base){
    const used=base.avg*Math.max(0,daysBetween(d.buyDate,t));
    const estEnd=shiftDate(d.buyDate,Math.max(1,Math.ceil(d.price/base.avg)));
    return {kind:'基准',perDay:base.avg,count:base.count,used,estEnd};
  }
  if(d.estEndDate){
    const ds=daysBetween(d.buyDate,d.estEndDate);
    return {kind:'预估',perDay:ds>0?d.price/ds:d.price,estEnd:d.estEndDate};
  }
  const ds=Math.max(1,daysBetween(d.buyDate,t));
  return {kind:'临时',perDay:d.price/ds,estEnd:null};
}
// 今日日用品成本 = 使用中(基准/预估/临时) + 按平均计(有基准的实际平均)
function dailyTotalCost(){
  return (S.dailies||[]).reduce((s,d)=>{
    if(d.avgOnly){const c=dailyCalc(d);return s+(c.kind==='实际'?c.perDay:0);}
    if(!d.endDate)return s+dailyCalc(d).perDay;
    return s;
  },0);
}
function dailyCard(d){
  const c=dailyCalc(d);
  if(d.avgOnly){
    return '<div class="daily-item avg" onclick="showDaily(\''+d.id+'\')">'
      +'<div class="d-top"><b>'+esc(d.name)+'</b><span class="d-kind act">实际</span></div>'
      +'<div class="d-line">¥'+d.price+' · '+d.buyDate.slice(5).replace('-','/')+' 购入</div>'
      +(c.tempAvg
        ?'<div class="d-line">平均 ¥'+moneyFmt(c.perDay)+'/天（价格÷购买至今，同类用完后再按同类平均校准）</div>'

function saveDaily(){
  const name=document.getElementById('d_name').value.trim();

  const buy=document.getElementById('d_buy').value||todayStr();
  const avgOnly=document.getElementById('d_avg').checked;
  let cat=dCat;
  if(cat==='__new'){cat=(document.getElementById('d_cat_new').value||'').trim();if(!cat){alert('请输入新类别名');return;}}

  let end=avgOnly?'':(document.getElementById('d_end').value||'');
  let est=avgOnly?'':(document.getElementById('d_est').value||'');

  if(dEditId){const d=(S.dailies||[]).find(x=>x.id===dEditId);if(d){d.name=name;d.price=price;d.buyDate=buy;d.cat=cat;d.endDate=end;d.estEndDate=est;d.avgOnly=avgOnly;}}

    const totT=(S.savings||[]).reduce((s,g)=>s+(Number(g.target)||0),0);

    h+='<div class="ex-total"><div class="l">存钱总目标</div><div class="v">¥'+moneyFmt(totT)+'</div><div class="s">已存 ¥'+moneyFmt(totC)+'</div></div>';

    h+='<div class="bar"><i style="width:'+Math.min(100,pct)+'%;background:'+(over?'#22c55e':'#5B82A6')+'"></i></div>';

    h+='</div>';
  });

}

// ---------- 任务拖动排序（待办池 + 每日代办，浮起跟手） ----------
let td=null;           // {kind:'pool'|'today', i, startY, offset, el}
const TASK_ROW_H=46;   // 行高兜底（无 offsetHeight 时）
function tList(kind){
  if(kind==='pool')return S.tasks.filter(t=>t.status!=='done'&&!t.inToday);
  const d=todayStr();
  return S.tasks.filter(t=>{
    if(t.status==='done'&&t.doneDate&&t.doneDate!==d)return false;
    if(t.inToday)return true;
    if(t.assignedDate===d||t.doneDate===d||t.failDate===d)return true;
    return false;
  });
}
function tDown(e,i,kind){
  if(!e.target.closest('.tk-drag'))return;   // 只按住 ≡ 手柄（避免和滚动/按钮冲突）
  if(e.cancelable)e.preventDefault();
  const rows=document.querySelectorAll('#view .trow');
  const el=rows[i];
  if(!el)return;
  td={kind,i,startY:evY(e),offset:0,cur:i,el};
  el.style.zIndex='9';
  el.style.position='relative';
  el.style.transition='none';
  el.classList.add('drag');
}
function tMove(e){
  if(!td)return;
  if(e.cancelable)e.preventDefault();
  const offset=evY(e)-td.startY;
  td.offset=offset;
  const rows=document.querySelectorAll('#view .trow');
  const list=tList(td.kind);
  const h=k=>((rows[k]&&rows[k].offsetHeight)||TASK_ROW_H);
  // 被拖卡当前落点（浮点位置，跨过半行进位）
  let cur=td.i, acc=offset;
  while(cur>0&&acc<-h(cur)/2){cur--;acc+=h(cur);}
  while(cur<list.length-1&&acc>h(cur+1)/2){cur++;acc-=h(cur+1);}
  td.cur=cur;
  // 被拖卡跟手；其他卡片实时让位（被挤开/挤回）
  rows.forEach((r,k)=>{
    if(k===td.i){r.style.transform='translateY('+offset+'px) scale(1.02)';return;}
    let sh=0;
    if(cur>td.i&&k>td.i&&k<=cur)sh=-h(k);      // 向下拖：下面的卡上移让位
    if(cur<td.i&&k>=cur&&k<td.i)sh=+h(k);      // 向上拖：上面的卡下移让位
    r.style.transform=sh?'translateY('+sh+'px)':'';
  });
}
function tUp(){
  if(!td)return;
  const kind=td.kind,i=td.i,cur=(td.cur!==undefined?td.cur:i);
  const list=tList(kind);
  const target=Math.max(0,Math.min(list.length-1,cur));
  td=null;
  if(target!==i){
    const [it]=list.splice(i,1);
    list.splice(target,0,it);
    applyListOrder(list);
    save();
  }
  render();
}
// 把当前列表的新顺序写回 S.tasks（未显示的保持原相对顺序）
function applyListOrder(list){
  const ids=list.map(t=>t.id);
  S.tasks=list.concat(S.tasks.filter(t=>!ids.includes(t.id)));
}
function bindTaskDrag(){
  const kind=view==='pool'?'pool':'today';
  if(kind==='today'&&taskDate!==todayStr())return;   // 查看历史日期不拖
  document.querySelectorAll('#view .tk-drag').forEach((el,i)=>{
    if(el.dataset.bound)return;
    el.dataset.bound='1';
    el.addEventListener('pointerdown',e=>tDown(e,i,kind));
    el.addEventListener('touchstart',e=>tDown(e,i,kind),{passive:false});
    el.addEventListener('mousedown',e=>tDown(e,i,kind));
  });
}

// 跨天后结算：
// 1) 失败的任务：点了“次日回池”→ 回到待办池；没点 → 像已完成一样归档，从任务板块消失（仅留月历记录）
// 2) 指派日已过（长线任务没跑满）→ 自动回待办池
function resetStale(){
  const d=todayStr();let ch=false;
  S.tasks.forEach(t=>{
    if(t.status==='done') return;                 // 已完成/已归档的保持不动
    if(t.failDate && t.failDate<d){              // 失败跨天结算
      if(t.type==='long'){                       // 长线任务没跑满 → 次日自动回待办池（无论是否点过次日回池）
        t.assignedDate=null;t.todayPlan=null;t.doneDate=null;t.failDate=null;t.returnNext=false;
      }else if(t.returnNext){                    // 短线任务点了“次日回池”
        t.inToday=false;t.assignedDate=null;t.todayPlan=null;t.doneDate=null;t.failDate=null;t.returnNext=false;
      }else{                                     // 短线任务没点 → 归档为已完成（失败记录），退出任务板块
        t.status='done';t.doneDate=t.failDate;t.inToday=false;t.assignedDate=null;t.todayPlan=null;t.failDate=null;
      }
      ch=true; return;
    }
    if(t.assignedDate && t.assignedDate<d){      // 指派日已过 → 回到待办池
      t.assignedDate=null;t.todayPlan=null;t.doneDate=null;t.failDate=null;ch=true;
    }
  });
  if(ch)save();
}

  }
  else applySuccess(id,plan);
}
function applySuccess(id,plan){
  const t=find(id);
  if(t.longMode==='count'){
    const n=document.getElementById('ex')?parseFloat(document.getElementById('ex').value)||0:0;
    t.progress=Math.min(999,(t.progress||0)+n);
    log(id,'success',n);
  }else{
    const extra=document.getElementById('ex')?parseFloat(document.getElementById('ex').value)||0:0;
    t.progress=Math.min(999,t.progress+plan+extra);
    log(id,'success',plan+extra);
  }
  if(t.longMode==='count'){if((t.progress||0)>=(t.total||1))t.status='done';}
  else if(t.progress>=100)t.status='done';
  t.doneDate=todayStr();
  t.failDate=null;
  closeModal();save();render();
}

    else prog=parseFloat(document.getElementById('nt_prog').value)||0;
  }
  S.tasks.push({id:uid(),title,type:F.type,category:F.category,deadline,progress:prog,longMode:F.longMode,total,status:'active',inToday:false,assignedDate:null,todayPlan:null,doneDate:null,failDate:null,returnNext:false});
  closeModal();save();render();
}

function addCat(){const v=document.getElementById('newcat').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();}showCatManage();}
function delCat(c){if(S.cats.length<=1)return;S.cats=S.cats.filter(x=>x!==c);S.tasks.forEach(t=>{if(t.category===c)t.category='其他';});save();showCatManage();}

// ---------- 数据备份（导出 / 导入 / 用量 / 清理照片） ----------
function storeSize(){try{return (localStorage.getItem(STORE)||'').length;}catch(e){return JSON.stringify(S).length;}}
function fmtSize(n){
  if(n<1024)return n+' 字符';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  return (n/1048576).toFixed(2)+' MB';
}
function showBackup(){
  const used=storeSize();
  const pct=Math.min(100,Math.round(used/52428800*100));   // 按约 50MB 上限估算（额度放宽）
  let h='<h3 style="margin-bottom:6px">数据备份与恢复 <button class="no" id="bk_toggle" onclick="toggleBackupSec()" style="float:right;padding:2px 10px">展开</button></h3>';
  h+='<div class="tip-mini" style="margin-bottom:4px">默认收起，换手机 / 清缓存前先来这里备份一份</div>';
  h+='<div id="bk_sec" style="display:none">';
  h+='<label>存储用量（额度充足，约 50MB 上限）</label><div class="bar" style="margin-bottom:4px"><i style="width:'+pct+'%;background:'+(pct>90?'#ef4444':'#5B82A6')+'"></i></div>';
  h+='<div class="pct" style="margin-bottom:8px">已用 '+fmtSize(used)+'（'+pct+'%）</div>';
  h+='<label>导出：复制下面的文本，存到备忘录 / 微信收藏里。换手机或清缓存后，粘贴回来点「恢复备份」即可找回全部记录。</label>';
  h+='<textarea id="bk_out" readonly style="height:64px;font-size:10px;color:#6b7280">'+esc(JSON.stringify(S))+'</textarea>';
  h+='<div class="row" style="margin-top:8px"><button class="ok" onclick="copyBackup()">复制备份</button></div>';
  h+='<label style="margin-top:10px">导入：粘贴备份文本，点「恢复备份」（会覆盖当前全部数据）</label>';
  h+='<textarea id="bk_in" placeholder="粘贴备份文本…" style="height:48px;font-size:10px"></textarea>';
  h+='<div class="row"><button class="no" onclick="closeModal()">关闭</button><button class="ok" style="background:#ef4444" onclick="importBackup()">恢复备份</button></div>';
  h+='</div>';
  // ---- Obsidian 自动同步配置 ----
  const ob=S.obsidian||{vault:'',folder:'Daily',auto:false};
  h+='<hr><h3 style="margin-top:14px">Obsidian 自动同步</h3>';
  h+='<label>仓库名（vault，可留空＝默认仓库）</label><input id="ob_vault" class="ob-input" value="'+esc(ob.vault||'')+'">';
  h+='<label>每日笔记文件夹（如 Daily 或 日记）</label><input id="ob_folder" class="ob-input" value="'+esc(ob.folder||'Daily')+'">';
  h+='<label class="switch-row"><input type="checkbox" id="ob_auto" '+(ob.auto?'checked':'')+'> 过 12 点自动把前一天整理进 Obsidian</label>';
  h+='<div class="row" style="margin-top:8px"><button class="ok" onclick="saveObsidianCfg()">保存设置</button><button class="no" onclick="syncDayToObsidian(todayStr())">同步今天</button><button class="no" onclick="syncDayToObsidian(yesterdayStr())">同步昨天</button></div>';
  h+='<div class="tip-mini" style="margin-top:6px">自动同步需 App 在 12 点后仍打开（或次日打开时会自动补同步昨天）。手机端会跳转到 Obsidian 创建笔记。</div>';
  // ---- 云同步（GitHub 私有 Gist）----
  const cl=cloudCfg();
  h+='<hr><h3 style="margin-top:14px">云同步（GitHub Gist）</h3>';
  h+='<label>GitHub Token（仅需 gist 权限，只保存在本机，用于推送到你的私有 Gist）</label><input id="cl_token" class="ob-input" value="'+esc(cl.token||'')+'" placeholder="ghp_…">';
  h+='<label class="switch-row"><input type="checkbox" id="cl_auto" '+(cl.auto?'checked':'')+'> 打开 App 时自动同步（昨天补推一次 + 今天每 10 分钟）</label>';
  h+='<div class="row" style="margin-top:8px"><button class="ok" onclick="saveCloudCfg()">保存设置</button><button class="no" onclick="pushDayToGist(todayStr())">同步今天</button><button class="no" onclick="pushDayToGist(yesterdayStr())">同步昨天</button></div>';
  h+='<div class="tip-mini" style="margin-top:6px">状态：'+cloudStatusText()+'。推送后电脑端定时脚本自动写入 Obsidian 日记文件夹（免插件）。Token 创建：GitHub → Settings → Developer settings → Personal access tokens → Generate new token，勾选 gist。</div>';
  modal(h);
}
function copyBackup(){
  const ta=document.getElementById('bk_out');
  ta.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>{ok=true;alert('已复制，请保存好这段文本');}).catch(()=>{});}
  if(!ok)alert('复制失败，请长按文本手动复制');
}
function importBackup(){
  const v=document.getElementById('bk_in').value.trim();
  if(!v){alert('请先粘贴备份文本');return;}
  let obj=null;
  try{obj=JSON.parse(v);}catch(e){alert('文本不是有效的备份格式');return;}
  if(!obj||typeof obj!=='object'||!Array.isArray(obj.tasks)){alert('内容不是备份数据');return;}
  if(!confirm('恢复将覆盖当前全部数据，确定？'))return;
  S=obj;
  S.cats=S.cats&&S.cats.length?S.cats:['其他','工作','学习','运动','副业'];
  save();closeModal();render();
}
function toggleBackupSec(){
  const s=document.getElementById('bk_sec');
  const b=document.getElementById('bk_toggle');
  if(!s)return;
  const show=s.style.display!=='none';
  s.style.display=show?'none':'block';
  if(b)b.textContent=show?'展开':'收起';
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
