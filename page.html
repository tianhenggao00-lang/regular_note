<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#5B82A6">
<title>自律小记 · 任务</title>
<style>
/* ---- 液态玻璃风格基础 ---- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,system-ui,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;
  font-size:14px;
  /* 液态玻璃背景：柔和渐变 + 动态光晕 */
  background:
    radial-gradient(ellipse at 20% 20%, rgba(91, 130, 166, 0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(120, 160, 200, 0.14) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.5) 0%, transparent 70%),
    linear-gradient(135deg, #EEF2F6 0%, #F4F7FA 50%, #E9EEF4 100%);
  color:#1a1a2e;
  position:relative;
}
/* 动态光晕背景层 */
body::before{
  content:'';
  position:fixed;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle at 30% 30%, rgba(91, 130, 166, 0.10) 0%, transparent 40%),
    radial-gradient(circle at 70% 70%, rgba(130, 160, 200, 0.10) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(180, 200, 220, 0.06) 0%, transparent 50%);
  animation:liquidFlow 20s ease-in-out infinite;
  pointer-events:none;
  z-index:-1;
}
@keyframes liquidFlow{
  0%,100%{transform:translate(0,0) rotate(0deg);}
  33%{transform:translate(2%,1%) rotate(1deg);}
  66%{transform:translate(-1%,2%) rotate(-1deg);}
}
/* 液态玻璃卡片基础样式 */
.liquid-glass{
  background:rgba(255,255,255,0.45) !important;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,0.6) !important;
  box-shadow:
    0 8px 32px rgba(31, 38, 135, 0.08),
    inset 0 1px 0 rgba(255,255,255,0.8);
  transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.liquid-glass:hover{
  transform:translateY(-2px);
  box-shadow:
    0 12px 40px rgba(31, 38, 135, 0.12),
    inset 0 1px 0 rgba(255,255,255,0.9);
}
/* 暗色模式 - 液态玻璃深色主题 */
body.dark-disabled{
  background:
    radial-gradient(ellipse at 20% 20%, rgba(60, 80, 120, 0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(80, 60, 120, 0.25) 0%, transparent 50%),
    linear-gradient(135deg, #0f0c29 0%, #1a1a2e 50%, #16213e 100%);
  color:#e8e8f0;
}
body.dark-disabled::before{
  background:
    radial-gradient(circle at 30% 30%, rgba(80, 120, 200, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 70% 70%, rgba(120, 80, 200, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(200, 150, 100, 0.06) 0%, transparent 50%);
  animation:liquidFlow 25s ease-in-out infinite reverse;
}
body.dark-disabled .liquid-glass{
  background:rgba(255,255,255,0.05) !important;
  border:1px solid rgba(255,255,255,0.1) !important;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.3),
    inset 0 1px 0 rgba(255,255,255,0.05);
}
body.dark-disabled .liquid-glass:hover{
  box-shadow:
    0 12px 40px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255,255,255,0.08);
}
header{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(255,255,255,0.5) !important;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid rgba(255,255,255,0.4);
  box-shadow:0 4px 20px rgba(31, 38, 135, 0.06);
}
body.dark-disabled header{
  background:rgba(20,20,35,0.6) !important;
  border-color:rgba(255,255,255,0.08);
}
header h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.iconbtn{background:none;border:none;font-size:20px;cursor:pointer;color:inherit}
main{
  padding:14px;
  padding-bottom:84px;
  max-width:560px;
  margin:0 auto;
}
/* 液态玻璃主要按钮 */
.newbtn{
  width:100%;
  padding:13px;
  text-align:center;
  background:rgba(91,130,166,0.85) !important;
  backdrop-filter:blur(10px);
  color:#fff;
  border-radius:16px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.3);
  margin-bottom:10px;
  box-shadow:0 4px 20px rgba(91,130,166,0.25),inset 0 1px 0 rgba(255,255,255,0.3);
  transition:all 0.3s ease;
}
.newbtn:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 8px 30px rgba(91,130,166,0.35),inset 0 1px 0 rgba(255,255,255,0.4);
}
.row2{display:flex;gap:8px;margin-bottom:10px}
.half{flex:1;padding:10px;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:10px;cursor:pointer;font-size:13px}
body.dark-disabled .half{background:#1e2125;border-color:#2a2e33}
.filterbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
/* 液态玻璃标签 */
.chip{
  padding:6px 14px;
  border-radius:20px;
  background:rgba(238,242,255,0.6) !important;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#4338ca;
  font-size:12px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.5);
  box-shadow:0 2px 8px rgba(67,56,202,0.08);
  transition:all 0.25s ease;
}
.chip:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(67,56,202,0.15);
}
.chip.on{
  background:rgba(91,130,166,0.85) !important;
  color:#fff;
  border-color:rgba(91,130,166,0.6);
  box-shadow:0 4px 16px rgba(91,130,166,0.3);
}
.chip.manage{
  background:rgba(243,244,246,0.6) !important;
  color:#6b7280;
}
body.dark-disabled .chip{
  background:rgba(42,46,68,0.6) !important;
  color:#a5b4fc;
}
body.dark-disabled .chip.on{
  background:rgba(91,130,166,0.8) !important;
}
/* 液态玻璃卡片 */
.card{
  background:rgba(255,255,255,0.55) !important;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:16px;
  padding:12px 14px;
  margin-bottom:10px;
  border:1px solid rgba(255,255,255,0.7) !important;
  border-left:3px solid rgba(91,130,166,0.8) !important;
  position:relative;
  box-shadow:0 4px 24px rgba(31, 38, 135, 0.08),inset 0 1px 0 rgba(255,255,255,0.9);
  transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(31, 38, 135, 0.12),inset 0 1px 0 rgba(255,255,255,0.95);
}
body.dark-disabled .card{
  background:rgba(255,255,255,0.06) !important;
  border-color:rgba(255,255,255,0.1) !important;
  border-left-color:rgba(91,130,166,0.6) !important;
}
body.dark-disabled .card:hover{
  box-shadow:0 8px 32px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.08);
}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .title{font-size:15px;font-weight:600;line-height:1.35}
.card .type{font-size:11px;color:#8b95a1;margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#E9F0F7;color:#4338ca;margin-right:6px}
body.dark-disabled .tag{background:#2a2e44;color:#a5b4fc}
.dl{font-size:11px;margin-top:4px}
.dl.muted{color:#9ca3af}.dl.warn{color:#d97706}.dl.danger{color:#ef4444}
.bar{height:7px;background:#eceef1;border-radius:4px;margin:9px 0 4px;overflow:hidden}
body.dark-disabled .bar{background:#2a2e33}
.bar>i{display:block;height:100%;background:#5B82A6}
.bar>i.over{background:#22c55e}
.pct{font-size:11px;color:#6b7280}
.meal-tip{font-size:12px;color:#b45309;background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:6px 10px;margin-bottom:8px}
body.dark-disabled .meal-tip{color:#fbbf24;background:#3a2f12;border-color:#854d0e}
.tsb{display:flex;gap:5px;margin-top:4px}
.tsb button{flex:1;font-size:12px;padding:5px 0;border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#374151;cursor:pointer}
body.dark-disabled .tsb button{background:#262a2f;border-color:#3a3f45;color:#e6e8eb}
/* 液态玻璃按钮 */
.btn{
  font-size:13px;
  padding:9px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.4);
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  cursor:pointer;
  color:#1f2329;
  box-shadow:0 2px 8px rgba(31, 38, 135, 0.06);
  transition:all 0.25s ease;
}
.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(31, 38, 135, 0.12);
}
body.dark-disabled .btn{
  background:rgba(255,255,255,0.08);
  border-color:rgba(255,255,255,0.1);
  color:#e6e8eb;
}
.btn.primary{
  background:rgba(91,130,166,0.85) !important;
  color:#fff;
  border-color:rgba(91,130,166,0.6);
  box-shadow:0 4px 16px rgba(91,130,166,0.25);
}
.btn.green{
  background:rgba(34,197,94,0.85) !important;
  color:#fff;
  border-color:rgba(34,197,94,0.6);
  box-shadow:0 4px 16px rgba(34,197,94,0.25);
}
.btn.grey{
  background:rgba(107,114,128,0.6) !important;
  color:#fff;
}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
/* 液态玻璃开关按钮 */
.switch{
  position:fixed;
  right:16px;
  bottom:74px;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(31,35,41,0.7) !important;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:#fff;
  border:1px solid rgba(255,255,255,0.2);
  font-size:22px;
  cursor:pointer;
  z-index:20;
  box-shadow:0 8px 32px rgba(0,0,0,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s ease;
}
.switch:hover{
  transform:scale(1.1) rotate(15deg);
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
}
body.dark-disabled .switch{
  background:rgba(91,130,166,0.8) !important;
  box-shadow:0 8px 32px rgba(91,130,166,0.3);
}
.viewtitle{font-size:13px;color:#8b95a1;margin-bottom:8px;text-align:center}
/* 液态玻璃导航栏 */
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:rgba(255,255,255,0.5) !important;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid rgba(255,255,255,0.4);
  display:flex;
  z-index:15;
  box-shadow:0 -4px 20px rgba(31, 38, 135, 0.06);
}
body.dark-disabled nav{
  background:rgba(20,20,35,0.6) !important;
  border-color:rgba(255,255,255,0.08);
}
nav a{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:15px;
  font-weight:500;
  color:#9ca3af;
  text-decoration:none;
  transition:all 0.3s ease;
  position:relative;
}
nav a::after{
  content:'';
  position:absolute;
  bottom:4px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:transparent;
  transition:all 0.3s ease;
}
nav a.on::after{
  background:#5B82A6;
  box-shadow:0 0 8px rgba(91,130,166,0.6);
}
nav a.on{
  color:#5B82A6;
}
/* 液态玻璃弹窗 */
.mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.3) !important;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
  animation:fadeIn .18s ease;
}
.box{
  background:rgba(255,255,255,0.65) !important;
  backdrop-filter:blur(30px) saturate(200%);
  -webkit-backdrop-filter:blur(30px) saturate(200%);
  border-radius:24px;
  padding:24px;
  width:100%;
  max-width:380px;
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  border:1px solid rgba(255,255,255,0.8);
  box-shadow:
    0 20px 60px rgba(31, 38, 135, 0.15),
    inset 0 1px 0 rgba(255,255,255,0.9);
  animation:popIn .22s cubic-bezier(.2,.9,.3,1.15);
}
body.dark-disabled .box{
  background:rgba(30,30,50,0.75) !important;
  border-color:rgba(255,255,255,0.1);
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.box h3{font-size:15px;margin-bottom:12px}
.box label{display:block;font-size:12px;color:#6b7280;margin:10px 0 4px}
.box input,.box select{width:100%;padding:9px;border:1px solid rgba(255,255,255,0.6);border-radius:8px;font-size:14px;background:rgba(255,255,255,0.5) !important;color:#1f2329;backdrop-filter:blur(10px)}
body.dark-disabled .box input{background:rgba(255,255,255,0.08) !important;border-color:rgba(255,255,255,0.15);color:#e6e8eb}
.box textarea{width:100%;padding:9px;border:1px solid rgba(255,255,255,0.6);border-radius:8px;font-size:14px;background:rgba(255,255,255,0.5) !important;color:#1f2329;resize:vertical;min-height:52px;font-family:inherit;backdrop-filter:blur(10px)}
body.dark-disabled .box textarea{background:rgba(255,255,255,0.08) !important;border-color:rgba(255,255,255,0.15);color:#e6e8eb}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:9px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer;font-size:14px}
body.dark-disabled .seg button{background:#1e2125;border-color:#3a3f45;color:#e6e8eb}
.seg button.on{background:#5B82A6;color:#fff;border-color:#5B82A6}
.box .row{display:flex;gap:8px;margin-top:16px}
.box .row button{flex:1;padding:10px;border-radius:9px;border:none;font-size:14px;cursor:pointer}
.box .row .ok{background:#5B82A6;color:#fff}
.box .row .no{background:#eceef1;color:#374151}
body.dark-disabled .box .row .no{background:#3a3f45;color:#e6e8eb}
.catlist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.catlist .c{display:flex;align-items:center;gap:4px;background:#f3f4f6;padding:4px 8px;border-radius:10px;font-size:12px}
body.dark-disabled .catlist .c{background:#2a2e33}
.catlist .c b{cursor:pointer;color:#ef4444;font-weight:700}
.empty{text-align:center;color:#9ca3af;padding:40px 0;font-size:13px}
/* 记录中心：备忘录 / 其他 / 纪念日 / 病历 / 灵感 */
.memo-list,.other-grid,.anniv-list,.med-list,.ins-list{display:flex;flex-direction:column;gap:10px}
.memo-item,.anniv-item,.med-item,.ins-item{
  position:relative;
  background:rgba(255,255,255,0.55) !important;
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,0.7) !important;
  border-radius:14px;
  padding:12px 40px 12px 12px;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(31, 38, 135, 0.08);
  transition:all 0.3s ease;
}
.memo-item:hover,.anniv-item:hover,.med-item:hover,.ins-item:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(31, 38, 135, 0.12);
}
body.dark-disabled .memo-item,body.dark-disabled .anniv-item,body.dark-disabled .med-item,body.dark-disabled .ins-item{
  background:rgba(255,255,255,0.06) !important;
  border-color:rgba(255,255,255,0.1) !important;
}
body.dark-disabled .memo-item:hover,body.dark-disabled .anniv-item:hover,body.dark-disabled .med-item:hover,body.dark-disabled .ins-item:hover{
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}
.m-chk,.mm-chk{position:absolute;left:12px;top:12px;width:20px;height:20px;border:1.5px solid #cbd5e1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer}
.m-chk.on{background:#22c55e;border-color:#22c55e}
.memo-tip{text-align:center;font-size:11px;color:#9ca3af;background:#f3f4f6;border-radius:8px;padding:6px;margin-bottom:10px}
body.dark-disabled .memo-tip{background:#2a2e33}
.m-drag{position:absolute;left:9px;top:12px;color:#cbd5e1;font-size:18px;line-height:20px;cursor:grab;user-select:none;touch-action:none}
body.dark-disabled .m-drag{color:#4b5563}
.m-drag:active{cursor:grabbing}
.memo-item .m-chk{left:34px}
.m-body{margin-left:58px}
.memo-item{transition:transform .16s ease}
.memo-item.drag{box-shadow:0 5px 16px rgba(0,0,0,.2);background:#fff;z-index:9}
body.dark-disabled .memo-item.drag{background:#262a2f}
.m-text{font-size:15px;color:#1f2329}
body.dark-disabled .m-text{color:#e6e8eb}
.m-text.dn{text-decoration:line-through;color:#9ca3af}
.m-due{font-size:12px;color:#94a3b8;margin-top:2px}

.m-pin.on{background:#a855f7;color:#fff}
body.dark-disabled .m-pin{color:#c4b5fd;border-color:#c4b5fd}

.m-del:hover{color:#ef4444}
.memo-mini{margin-top:8px;background:#f8fafc;border-radius:12px;padding:8px 12px}
body.dark-disabled .memo-mini{background:#1a1d21}
.mm-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.mm-chk{flex:none;width:18px;height:18px;border:1.5px solid #cbd5e1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;cursor:pointer}
.mm-chk:not(:empty){background:#22c55e;border-color:#22c55e}
.hb-st.fail{color:#ef4444}
.mm-text{flex:1;font-size:14px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dark-disabled .mm-text{color:#cbd5e1}
.mm-due{flex:none;font-size:11px;color:#94a3b8}.mm-due.warn{color:#f59e0b}.mm-due.over{color:#ef4444}
.other-grid{margin-top:4px}
.other-card{
  position:relative;
  background:rgba(255,255,255,0.55) !important;
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,0.7) !important;
  border-radius:16px;
  padding:16px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:4px;
  box-shadow:0 4px 24px rgba(31, 38, 135, 0.08);

}
.other-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(31, 38, 135, 0.12);
}
body.dark-disabled .other-card{
  background:rgba(255,255,255,0.06) !important;
  border-color:rgba(255,255,255,0.1) !important;
}
body.dark-disabled .other-card:hover{
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}
.oc-name{font-size:17px;font-weight:600;color:#1f2329}
body.dark-disabled .oc-name{color:#e6e8eb}

<body>
<header>
  <h1>自律小记<span id="appVer" style="font-size:10px;color:#9ca3af;font-weight:400;margin-left:6px"></span></h1>
  <div style="display:flex;gap:12px;align-items:center">
    <button class="iconbtn" onclick="showHelp()" title="帮助">?</button>
    <button class="iconbtn" onclick="showBackup()" title="数据备份">💾</button>
    
  </div>
</header>
<main id="view"></main>
<button class="switch" id="switchBtn" onclick="toggleView()" title="切换">⇄</button>
<nav id="nav"></nav>
<div id="modal"></div>

<script>
const STORE='sd_task_v1';
const SCHEMA_VER=5;   // 数据结构版本：每次增删字段时 +1，migrate() 会自动补齐旧数据缺失的字段
let S=load();
function load(){try{let o=JSON.parse(localStorage.getItem(STORE));if(!o||typeof o!=='object'||Array.isArray(o))return ensureAnnivDefaults(seed());return ensureAnnivDefaults(migrate(o));}catch(e){return ensureAnnivDefaults(seed());}}
// 自动导入「每年浮动」类节假日（母亲节/父亲节），老用户打开时若无则补齐；同时兼容 pinnedAnniv 字段
function ensureAnnivDefaults(o){
  o.anniversaries=o.anniversaries||[];
  const defs=[
    {name:'母亲节',month:5,n:2,wday:0,color:'#a855f7'},
    {name:'父亲节',month:6,n:3,wday:0,color:'#a855f7'}
  ];
  defs.forEach(d=>{
    if(!o.anniversaries.some(a=>a.name===d.name)){
      o.anniversaries.push({id:uid(),name:d.name,type:'week',month:d.month,n:d.n,wday:d.wday,date:'',color:d.color,note:''});
    }
  });
  if(!('pinnedAnniv' in o))o.pinnedAnniv='';
  return o;
}
// 版本化迁移：1) 补齐 seed 中存在但旧数据缺失的字段（防旧数据缺字段报错）；2) 按版本分支处理结构性变更
function migrate(o){
  const base=seed();
  for(const k in base){ if(!(k in o)) o[k]=base[k]; }
  if(!o.ver||o.ver<SCHEMA_VER){ /* 未来在此按 o.ver 分支处理历史结构变更 */ o.ver=SCHEMA_VER; }
  // v5：饮食照片功能已移除，清理存量图片数据释放空间
  if(Array.isArray(o.meals))o.meals.forEach(m=>{if(m)m.img='';});
  return o;
}
function seed(){return{ver:SCHEMA_VER,tasks:[],cats:['其他','工作','学习','运动','副业'],logs:[],sleep:[],activity:[],plan:[],actTypes:[],hiddenTypes:[],habits:[],meals:[],waters:[],exercise:[],exTypes:[],moneyIncome:0,moneyTypes:[],hiddenMoneyTypes:[],moneyPlans:[],moneyRecords:[],assets:[],memberships:[],savings:[],collects:[],summaries:[],goals:[],dayMarks:{},markTypes:[],memos:[],anniversaries:[],medicals:[],inspirations:[],pinnedAnniv:'',hobbies:[],commonActs:[],dailies:[],obsidian:{vault:'',folder:'Daily',auto:false},syncedDays:{},cloud:{token:'',gistId:'',auto:false,pushed:{}}};}
function save(){localStorage.setItem(STORE,JSON.stringify(S));}
function find(id){return S.tasks.find(t=>t.id===id);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// 当前视图与筛选状态
let view='pool';          // 'pool' | 'today'
let tab='today';          // 默认打开「今日」页 | 'today' | 'task' | 'record' | 'calendar'
let filterCat='全部';
let sortMode='default';   // 'default' | 'deadline'
let filterOpen=false;
let recView='grid';       // 记录中心：'grid' 宫格 | 'sleep'/'activity'/'habit'/'meal'/'exercise' 等二级页
let sleepRange=7;          // 睡眠图表范围：7 | 30 天
let actDate='';            // 活动追踪查看的日期（初始今天，见 render 前初始化）
let mealDate='';           // 饮食查看的日期

// ---------- 日期 ----------
function todayStr(){const d=new Date();const o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10);}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);const o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10);}
function dlLabel(deadline){
  if(!deadline)return{text:'无截止',cls:'muted'};
  const t=todayStr();
  if(deadline<t)return{text:'已过期',cls:'danger'};
  if(deadline===t)return{text:'今天截止',cls:'danger'};
  const days=Math.ceil((new Date(deadline)-new Date(t))/86400000);
  return{text:'剩'+days+'天',cls:days<=3?'warn':'muted'};
}

// ---------- 导航（纯文字大字，不用图标） ----------
function renderNav(){
  const items=[['today','今日'],['task','任务'],['record','记录'],['calendar','月历']];
  document.getElementById('nav').innerHTML=items.map(i=>
    '<a class="'+(tab===i[0]?'on':'')+'" onclick="goTab(\''+i[0]+'\')">'+i[1]+'</a>'
  ).join('');
}
function goTab(t){tab=t;filterOpen=false;if(t==='record')recView='grid';render();}

// ---------- 主渲染 ----------
function render(){
  if(!actDate)actDate=todayStr();
  if(!mealDate)mealDate=todayStr();
  if(!sumDate)sumDate=todayStr();
  if(!sleepDate)sleepDate=todayStr();
  if(!taskDate)taskDate=todayStr();
  if(!habitDate)habitDate=todayStr();
  if(!exViewDate)exViewDate=todayStr();
  if(!mDate)mDate=todayStr();
  resetStale();
  renderNav();
  const sw=document.getElementById('switchBtn');
  sw.style.display=(tab==='task')?'flex':'none';
  const v=document.getElementById('view');
  if(tab==='task') v.innerHTML=renderTask();
  else if(tab==='today') v.innerHTML=renderTodayPage();
  else if(tab==='record') v.innerHTML=renderRecord();
  else if(tab==='calendar') v.innerHTML=renderCalendar();
  if(tab==='task'){bindTaskDrag();}
  if(tab==='record' && recView==='activity' && actSub==='table') bindDrag();
  if(tab==='record' && recView==='memo') bindMemoDrag();
  if(tab==='record' && recView==='activity' && actSub!=='table'){bindCaDrag();bindCaCard();}
  if(tab==='today' && todaySub==='goals'){bindGoalsDrag();}
}

// 今日页快捷跳转：记录中心某模块的今天视图
function jumpRec(v){
  tab='record';
  if(v==='schedule'){recView='activity';actSub='table';}
  else{recView=v;if(v==='activity')actSub='common';}
  if(v==='schedule')v='activity';

let gEditId=null;
const GOAL_ROW_H=48;   // 每行高（用于拖拽换位阈值）

function renderGoals(){

function goalRow(g){

function saveGoal(){

// 目标排序拖拽（浮起跟手）：按住 → 卡片提起来跟随手指 → 松手落位
function gDown(e,i){
  if(!e.target.closest('.g-drag'))return;
  if(e.cancelable)e.preventDefault();
  const rows=document.querySelectorAll('#goalList .goal-row');
  const el=rows[i];
  if(!el)return;
  gd={i,startY:evY(e),offset:0,cur:i,el};
  el.style.zIndex='9';
  el.style.position='relative';
  el.style.transition='none';
  el.classList.add('drag');
}
function gMove(e){
  if(!gd)return;
  if(e.cancelable)e.preventDefault();
  const offset=evY(e)-gd.startY;
  gd.offset=offset;
  const rows=document.querySelectorAll('#goalList .goal-row');
  const list=S.goals.filter(g=>!g.done);
  const h=k=>((rows[k]&&rows[k].offsetHeight)||GOAL_ROW_H);
  let cur=gd.i, acc=offset;
  while(cur>0&&acc<-h(cur)/2){cur--;acc+=h(cur);}
  while(cur<list.length-1&&acc>h(cur+1)/2){cur++;acc-=h(cur+1);}
  gd.cur=cur;
  rows.forEach((r,k)=>{
    if(k===gd.i){r.style.transform='translateY('+offset+'px) scale(1.02)';return;}
    let sh=0;
    if(cur>gd.i&&k>gd.i&&k<=cur)sh=-h(k);
    if(cur<gd.i&&k>=cur&&k<gd.i)sh=+h(k);
    r.style.transform=sh?'translateY('+sh+'px)':'';
  });
}
function gUp(){
  if(!gd)return;
  const i=gd.i,cur=(gd.cur!==undefined?gd.cur:i);
  const list=S.goals.filter(g=>!g.done);   // 只在「进行中」列表内排序
  const target=Math.max(0,Math.min(list.length-1,cur));
  gd=null;
  if(target!==i){
    const [it]=list.splice(i,1);
    list.splice(target,0,it);
    S.goals=list.concat(S.goals.filter(g=>g.done));   // 已完成保持沉底
    save();
  }
  render();
}
function bindGoalsDrag(){
  const els=document.querySelectorAll('#goalList .g-drag');
  els.forEach((el,i)=>{
    if(el.dataset.bound)return;
    el.dataset.bound='1';
    el.addEventListener('pointerdown',e=>gDown(e,i));
    el.addEventListener('touchstart',e=>gDown(e,i),{passive:false});
    el.addEventListener('mousedown',e=>gDown(e,i));
  });
}

// ---------- 子视图横向滑动切换（锻炼 / 记账 / 收藏 / 睡眠） ----------
// 左滑切下一个子页，右滑切回上一个；点击、纵向滚动不受影响。
let swipeStart=null, swipeLock=false;
function swipeEnabled(){return tab==='record'&&(recView==='exercise'||recView==='money'||recView==='collect'||recView==='sleep');}
function bindSwipe(){
  const v=document.getElementById('view');
  if(!v||v.dataset.swipe)return;
  v.dataset.swipe='1';
  v.addEventListener('pointerdown',e=>{
    swipeLock=false;                          // 清残留，避免误吞下一次点击
    if(!swipeEnabled())return;
    swipeStart={x:e.clientX,y:e.clientY};
  });
  v.addEventListener('pointermove',e=>{
    if(!swipeStart||!swipeEnabled())return;
    const dx=e.clientX-swipeStart.x, dy=e.clientY-swipeStart.y;
    if(Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy))swipeLock=true;   // 横向拖动开始
  });
  v.addEventListener('pointerup',e=>{
    if(!swipeStart)return;
    const dx=e.clientX-swipeStart.x, dy=e.clientY-swipeStart.y;
    swipeStart=null;
    if(!swipeEnabled())return;
    if(swipeLock){
      if(Math.abs(dx)>=50&&Math.abs(dx)>Math.abs(dy))swipeSwitch(dx<0?1:-1);
      // 保持 swipeLock=true，由下方捕获阶段的 click 吞掉本次拖动产生的点击
    }
  });
  v.addEventListener('pointercancel',()=>{swipeStart=null;swipeLock=false;});
  document.addEventListener('click',e=>{
    if(swipeLock){e.stopPropagation();e.preventDefault();swipeLock=false;}
  },true);
}
function swipeSwitch(dir){
  if(recView==='exercise'){
    const o=['today','week'],i=o.indexOf(exSub),n=o[Math.min(o.length-1,Math.max(0,i+dir))];
    if(n!==exSub)setExSub(n);
  }else if(recView==='money'){
    const o=['flow','plan','asset','daily','save'],i=o.indexOf(moneySub),n=o[Math.min(o.length-1,Math.max(0,i+dir))];
    if(n!==moneySub)setMoneySub(n);
  }else if(recView==='collect'){
    const o=DEF_CL_TYPES.map(t=>t.id),i=o.indexOf(clTab),n=o[Math.min(o.length-1,Math.max(0,i+dir))];
    if(n!==clTab)setClTab(n);
  }else if(recView==='sleep'){
    if(dir>0&&sleepRange===7)setSleepRange(30);
    else if(dir<0&&sleepRange===30)setSleepRange(7);
  }
}

// ---------- 待办池 ----------
function renderPool(){
  let list=S.tasks.filter(t=>t.status!=='done' && !t.inToday);
  if(filterCat!=='全部') list=list.filter(t=>t.category===filterCat);
  // 已指派的任务沉到最底部（灰显保留，不消失）；同组内短线排长线前面
  list=list.slice().sort((a,b)=>{
    const wa=a.assignedDate?1:0, wb=b.assignedDate?1:0;
    if(wa!==wb) return wa-wb;
    const ta=a.type==='short'?0:1, tb=b.type==='short'?0:1;
    if(ta!==tb) return ta-tb;
    if(sortMode==='deadline'){
      if(!a.deadline&&!b.deadline)return 0;
      if(!a.deadline)return 1; if(!b.deadline)return -1;
      return a.deadline<b.deadline?-1:1;
    }
    return 0;
  });
  let html='<div class="viewtitle">待办池</div>';
  html+='<div class="goal-tip">按住卡片左侧 ≡ 上下拖动，可以调整顺序</div>';
  html+='<button class="newbtn" onclick="showNew()">＋ 新建任务</button>';
  html+='<div class="row2"><div class="half" onclick="toggleFilter()">按分类筛选</div><div class="half" onclick="toggleSort()">'+(sortMode==='deadline'?'按截止排序 ✓':'按截止日期排序')+'</div></div>';
  if(filterOpen){
    html+='<div class="filterbar">';
    html+='<button class="chip '+(filterCat==='全部'?'on':'')+'" onclick="setFilter(\'全部\')">全部</button>';
    S.cats.forEach(c=>{html+='<button class="chip '+(filterCat===c?'on':'')+'" onclick="setFilter(\''+c+'\')">'+c+'</button>';});
    html+='<button class="chip manage" onclick="showCatManage()">⚙ 分类管理</button>';
    html+='</div>';
  }
  if(list.length===0) html+='<div class="empty">待办池是空的，点上面「＋ 新建任务」</div>';
  list.forEach(t=>{html+=poolCard(t);});
  return html;
}
// 长线任务进度条渲染：百分比型(总进度 X%) / 个数型(已完成 X/N)
function longBarHTML(t){
  if(t.longMode==='count'){
    const total=Math.max(1,t.total||1);
    const cur=Math.min(999,t.progress||0);
    const over=cur>total;
    const pct=Math.min(100,Math.round(cur/total*100));
    return {bar:'<div class="bar"><i class="'+(over?'over':'')+'" style="width:'+pct+'%"></i></div>',
      text:'已完成 '+cur+'/'+total+(over?'（超前 '+(cur-total)+' 个）':'')};
  }
  const over=t.progress>100;
  return {bar:'<div class="bar"><i class="'+(over?'over':'')+'" style="width:'+Math.min(100,t.progress)+'%"></i></div>',
    text:'总进度 '+t.progress+'%'+(over?'（超前 '+(t.progress-100)+'%）':'')};
}
function poolCard(t){
  const dl=dlLabel(t.deadline);

  let h='<div class="card trow'+(assigned?' assigned':'')+'">';
  h+='<div class="top"><span class="tk-drag">≡</span><div style="flex:1;min-width:0"><div class="title">'+esc(t.title)+'</div><div class="type">'+(t.type==='long'?'长线任务':'短线任务')+'</div></div>';
  h+='<div style="text-align:right"><span class="tag">'+t.category+'</span><div class="dl '+dl.cls+'">'+dl.text+'</div></div></div>';
  if(t.type==='long'){
    const lb=longBarHTML(t);
    h+=lb.bar;
    h+='<div class="pct">'+lb.text;
    if(t.assignedDate)h+=' · 已指派 '+t.assignedDate;
    h+='</div>';
  }else if(t.assignedDate){
    h+='<div class="pct">已指派 '+t.assignedDate+'</div>';
  }
  h+='<div class="actions">';
  h+='<button class="btn primary" '+(t.inToday||assigned?'disabled':'')+' onclick="addToday(\''+t.id+'\')">加入今日</button>';
  if(assigned){
    h+='<button class="btn grey" disabled>已指派</button>';
    h+='<button class="btn" onclick="cancelAssign(\''+t.id+'\')">取消</button>';
  }else{
    h+='<button class="btn" onclick="assign(\''+t.id+'\')">指派到某天</button>';
    h+='<button class="btn" onclick="delTask(\''+t.id+'\')">删除</button>';
  }
  h+='</div></div>';
  return h;
}

// ---------- 每日代办（支持查看指定日期） ----------
function renderToday(ds){
  const d=ds||taskDate||todayStr();
  const today=todayStr();
  let list=S.tasks.filter(t=>{
    if(t.status==='done' && t.doneDate && t.doneDate!==d) return false;
    if(d===today && t.inToday)return true;
    if(t.assignedDate===d)return true;
    if(t.doneDate===d||t.failDate===d)return true;
    return false;
  });
  // 已完成沉底；失败沉到最底部
  list.sort((a,b)=>{
    const w=x=>{ if(x.status==='done'||x.doneDate===d) return 1; if(x.failDate===d) return 2; return 0; };
    return w(a)-w(b);
  });
  // 日期切换条（月历跳转可看那一天的任务完成情况）
  let html='<div class="actbar">';
  html+='<button class="nav" onclick="taskShift(-1)">‹</button>';
  html+='<span class="date">'+shortDate(d)+(d===today?'（今天）':'')+'</span>';
  html+='<button class="nav" onclick="taskShift(1)">›</button>';
  if(d!==today)html+='<button class="today" onclick="taskGoToday()">回今天</button>';
  html+='</div>';
  html+='<div class="viewtitle">'+(d===today?'每日代办':'当日任务')+' · '+shortDate(d)+'</div>';
  if(d===today)html+='<div class="goal-tip">按住卡片左侧 ≡ 上下拖动，可以调整顺序</div>';
  if(list.length===0 && d===today) html+='<div class="empty">今天还没有任务<br>去待办池点「加入今日」或「指派到某天」</div>';
  else if(list.length===0) html+='<div class="empty">这一天没有任务</div>';
  list.forEach(t=>{html+=todayCard(t,d);});
  return html;
}
function taskShift(n){taskDate=shiftDate(taskDate||todayStr(),n);render();}
function taskGoToday(){taskDate=todayStr();render();}
function todayCard(t,vd){
  const d=vd||todayStr();
  const isToday=d===todayStr();
  const dl=dlLabel(t.deadline);
  const assigned=!!t.assignedDate;
  const failed=t.failDate===d;
  const isPlan = t.assignedDate===d && !t.inToday;
  const planLabel = '已指派 '+t.assignedDate;
  const locked=(t.status==='done')||(t.doneDate===d);
  let h='<div class="card trow'+(assigned?' assigned':'')+(locked?' done':'')+(failed?' fail':'')+'">';
  h+='<div class="top">'+(isToday?'<span class="tk-drag">≡</span>':'')+'<div style="flex:1;min-width:0"><div class="title">'+esc(t.title)+'</div><div class="type">'+(t.type==='long'?'长线任务':'短线任务')+'</div></div>';
  h+='<div style="text-align:right"><span class="tag">'+t.category+'</span><div class="dl '+dl.cls+'">'+dl.text+'</div>'+(isPlan?'<div style="font-size:11px;color:#9ca3af;margin-top:2px">'+planLabel+'</div>':'')+'</div></div>';
  if(t.type==='long'){
    const lb=longBarHTML(t);
    h+=lb.bar;
    h+='<div class="pct">'+lb.text+'</div>';
  }
  if(!isToday){
    // 查看其他日期：只读，显示当天完成情况
    let st='',col='#9ca3af';
    if(t.doneDate===d){st='✓ 已完成';col='#22c55e';}
    else if(t.failDate===d){st='✗ 未完成';col='#ef4444';}
    else st='○ 待办';
    h+='<div class="actions"><span style="font-size:13px;color:'+col+';font-weight:600">'+st+'</span></div>';
  }else if(locked){
    h+='<div class="actions"><span style="color:#22c55e;font-size:13px">✓ 已完成（今日）</span><button class="btn" onclick="cancelAssign(\''+t.id+'\')">取消</button></div>';
  }else if(failed){
    h+='<div class="actions"><span style="color:#ef4444;font-size:13px">✗ 未完成（今日）</span>';
    if(t.type==='short'){
      h+='<button class="btn '+(t.returnNext?'act':'')+'" onclick="toggleReturn(\''+t.id+'\')">次日回池'+(t.returnNext?' ✓':'')+'</button>';
    }else{
      h+='<span style="font-size:12px;color:#9ca3af">未跑满·次日回待办池</span>';
    }
    h+='</div>';
  }else{
    h+='<div class="actions">';
    h+='<button class="btn green" onclick="doSuccess(\''+t.id+'\')">成功</button>';
    h+='<button class="btn" onclick="doFail(\''+t.id+'\')">失败</button>';
    h+='<button class="btn" onclick="cancelAssign(\''+t.id+'\')">取消</button>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

// ---------- 月历：月份切换 + 瘦长日历（数字+备注）+ 备忘（可自定义类别） + 9 框跳转 ----------
let calDate='';        // 选中日期（初始今天，见 render 前初始化）
let calMonth='';       // 显示的月份 'YYYY-MM'（初始当月）
// 各模块「查看选中日期」状态（月历跳转时定位到那一天；默认今天，见 render 前初始化）
let sleepDate='', taskDate='', habitDate='', exViewDate='', mDate='';
// 备忘类别编辑状态
let mkEditId=null, mkName='', mkColor='#ef4444';
const CAL_MODS=[
  ['task','任务'],['sleep','睡眠'],['activity','活动'],['habit','习惯'],
  ['meal','饮食'],['exercise','锻炼'],['money','记账'],['summary','总结'],['mark','纪念日']
];
function renderCalendar(){
  S.sleep=S.sleep||[];S.plan=S.plan||[];S.habits=S.habits||[];S.meals=S.meals||[];
  S.waters=S.waters||[];S.exercise=S.exercise||[];S.moneyRecords=S.moneyRecords||[];S.summaries=S.summaries||[];
  S.tasks=S.tasks||[];S.activity=S.activity||[];S.logs=S.logs||[];S.dayMarks=S.dayMarks||{};
  ensureMarkTypes();
  const today=todayStr();
  const cd=calDate||today;
  if(!calMonth)calMonth=cd.slice(0,7);
  const [cy,cm]=calMonth.split('-').map(Number);
  const first=new Date(cy,cm-1,1).getDay();
  const days=new Date(cy,cm,0).getDate();
  // 有记录的日期集合
  const active=new Set([].concat((S.logs||[]).map(l=>l.date))
    .concat(S.tasks.filter(t=>t.assignedDate).map(t=>t.assignedDate))
    .concat(S.tasks.filter(t=>t.doneDate).map(t=>t.doneDate))
    .concat(S.sleep.map(s=>s.date)).concat(S.activity.map(a=>a.date))
    .concat((S.habits||[]).reduce((a,h)=>a.concat(h.doneDates||[]),[]))
    .concat(S.meals.map(m=>m.date)).concat(S.waters.map(w=>w.date))
    .concat(S.exercise.map(x=>x.date)).concat(S.moneyRecords.map(x=>x.date))
    .concat(S.summaries.map(x=>x.date)));
  let h='<div class="cal-head"><button class="nav" onclick="calShift(-1)">‹</button><span class="ct">'+cy+'年 '+cm+'月</span><button class="nav" onclick="calShift(1)">›</button></div>';
  h+='<div class="cal-wrap">';
  // 瘦长日历格子：数字在上，备忘备注在下，标记色做底色+左侧色条
  h+='<div class="cal-grid">';
  ['日','一','二','三','四','五','六'].forEach(w=>h+='<div class="cw">'+w+'</div>');
  for(let i=0;i<first;i++)h+='<div class="cal-day empty"></div>';
  for(let dd=1;dd<=days;dd++){
    const ds=cy+'-'+String(cm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    const mk=S.dayMarks[ds]||{};
    const mt=mk.c?markTypeById(mk.c):null;
    const an=annivOnDate(ds);
    // 纪念日与月历备忘联动：共用同一套标记样式（底色+左色条+备注）
    const markColor=mt?mt.color:(an?an.color:null);
    const markNote=mk.n||(an?an.name:'');
    let mkSt='';
    if(markColor&&ds!==cd)mkSt=' style="background:'+markColor+'26;border-left:3px solid '+markColor+'"';
    h+='<div class="cal-day'+(active.has(ds)?' has':'')+(ds===today?' today':'')+(ds===cd?' sel':'')+'"'+mkSt+' onclick="setCalDay(\''+ds+'\')">'
      +'<div class="cd-num">'+dd+'</div><div class="cd-note">'+esc(markNote)+'</div></div>';
  }
  h+='</div>';
  // 选中日期信息行
  const cntAll=S.sleep.filter(s=>s.date===cd).length+S.activity.filter(a=>a.date===cd).length
    +S.meals.filter(m=>m.date===cd).length+S.waters.filter(w=>w.date===cd).length
    +S.exercise.filter(x=>x.date===cd).length+S.moneyRecords.filter(x=>x.date===cd).length
    +S.summaries.filter(x=>x.date===cd).length
    +S.habits.reduce((n,hh)=>n+((hh.doneDates||[]).includes(cd)?1:0),0)
    +S.tasks.filter(t=>t.assignedDate===cd||t.doneDate===cd||t.failDate===cd).length;
  const mi=parseInt(cd.slice(5,7),10), di=parseInt(cd.slice(8),10);
  h+='<div class="cal-info">'+mi+'月'+di+'日 · 当天 '+cntAll+' 条记录</div>';
  // 9 框（任务第一，含备忘，无收藏；点击=跳转该模块并定位到选中日期）
  h+='<div class="calg">'+CAL_MODS.map(m=>calBox(m[0],m[1],cd)).join('')+'</div>';
  h+='</div>';
  return h;
}
// 各模块当天简况（纯文本，速览行 + 9 框共用）；mode='good'|'bad' 用于习惯框分两排
function calSummary(id,cd,mode){
  if(id==='task'){
    const tk=S.tasks.filter(t=>t.assignedDate===cd||t.doneDate===cd||t.failDate===cd);
    if(!tk.length)return '—';
    const tDone=tk.filter(t=>t.doneDate===cd).length;
    const tFail=tk.filter(t=>t.failDate===cd).length;
    const tWait=tk.length-tDone-tFail;
    const parts=[];
    if(tDone)parts.push('完成'+tDone);
    if(tWait)parts.push('待办'+tWait);
    if(tFail)parts.push('失败'+tFail);
    return parts.join(' · ');
  }else if(id==='sleep'){
    const sl=S.sleep.find(s=>s.date===cd);
    return sl?(sl.bed+'→'+sl.wake):'—';
  }else if(id==='activity'){
    const pn=S.plan.filter(p=>p.date===cd).length;
    const an=S.activity.filter(a=>a.date===cd).length;
    if(pn&&an)return '计划'+pn+' · 实际'+an;
    if(pn)return '计划 '+pn+' 项';
    if(an)return '实际 '+an+' 项';
    return '—';
  }else if(id==='habit'){
    const goods=S.habits.filter(x=>x.kind!=='freq'&&!x.bad);
    const gd=goods.filter(x=>(x.doneDates||[]).includes(cd)).length;
    const bads=S.habits.filter(x=>x.kind!=='freq'&&x.bad);
    const bTouch=bads.filter(x=>(x.doneDates||[]).includes(cd)).length;
    const gTxt=goods.length?(gd+'/'+goods.length+' 已打卡'):'—';
    const bTxt=bads.length?('坏 '+(bads.length-bTouch)+'/'+bads.length+' 未触犯'):'—';
    if(mode==='good')return gTxt;
    if(mode==='bad')return bTxt;
    const parts=[];
    if(gTxt!=='—')parts.push(gTxt);
    if(bTxt!=='—')parts.push(bTxt);
    return parts.length?parts.join(' · '):'—';
  }else if(id==='meal'){
    const mn=S.meals.filter(m=>m.date===cd).length;
    const wv=S.waters.find(w=>w.date===cd);
    const parts=[];
    if(mn)parts.push(mn+' 餐');
    if(wv)parts.push('饮水'+(WATER_LEVELS.find(v=>v.id===wv.level)||{name:''}).name);
    return parts.length?parts.join(' · '):'—';
  }else if(id==='exercise'){
    const ex=S.exercise.filter(x=>x.date===cd).length;
    return ex?ex+' 次':'—';
  }else if(id==='money'){
    const mt=S.moneyRecords.filter(x=>x.date===cd).reduce((a,x)=>a+(x.amount||0),0);
    return mt?'¥'+moneyFmt(mt):'—';
  }else if(id==='summary'){
    const su=S.summaries.find(x=>x.date===cd);
    return su?'已写':'—';
  }else if(id==='mark'){
    const mk=S.dayMarks[cd]||{};
    const parts=[];
    if(mk.c){const mt=markTypeById(mk.c);if(mt)parts.push(mt.name);}
    if(mk.n)parts.push('有备注');
    (S.anniversaries||[]).filter(a=>a.type==='year'?a.date===cd.slice(5):a.date===cd).forEach(a=>parts.push(a.name));
    return parts.length?parts.join(' · '):'—';
  }
  return '—';
}
// 9 框（3×3 纯文字版）：点击=跳转该模块并定位到选中日期；习惯框好坏分两排
function calBox(id,name,cd){
  if(id==='habit'){
    const g=calSummary('habit',cd,'good'), b=calSummary('habit',cd,'bad');
    const cg=g!=='—'?' ok':'', cb=b!=='—'?' warn':'';
    return '<div class="calc" onclick="calJump(\'habit\',\''+cd+'\')"><div class="cn">习惯</div><div class="cs'+cg+'">'+(g==='—'?'—':g)+'</div><div class="cs'+cb+'">'+(b==='—'?'—':b)+'</div></div>';
  }
  const s=calSummary(id,cd);
  let cc='';
  if(s!=='—'){if(s.indexOf('¥')>=0||s.indexOf('待办')>=0||s.indexOf('失败')>=0||s.indexOf('未')>=0)cc=' warn';else if(s.indexOf('完成')>=0||s.indexOf('已写')>=0||s.indexOf('打卡')>=0)cc=' ok';else cc=' done';}
  const oc=id==='mark'?'showCalMark();':('calJump(\''+id+'\',\''+cd+'\')');
  return '<div class="calc" onclick="'+oc+'"><div class="cn">'+name+'</div><span class="cs'+cc+'">'+s+'</span></div>';
}
function calShift(n){
  const [y,m]=calMonth.split('-').map(Number);
  const d=new Date(y,m-1+n,1);
  calMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  render();
}
function setCalDay(ds){calDate=ds;calMonth=ds.slice(0,7);render();}
// 9 框点击：跳转到该模块并定位到选中日期（看那一天的数据）
function calJump(v,cd){
  const d=cd||calDate||todayStr();
  if(v==='task'){view='today';taskDate=d;tab='task';render();return;}
  tab='record';recView=v;
  if(v==='sleep')sleepDate=d;
  if(v==='activity'){actDate=d;actSub='common';}
  if(v==='habit')habitDate=d;
  if(v==='meal')mealDate=d;
  if(v==='exercise'){exViewDate=d;exSub='today';}
  if(v==='money'){mDate=d;moneySub='flow';}
  if(v==='summary')sumDate=d;
  render();
}
// ---------- 备忘：自定义类别（名称+颜色）+ 当天标记/备注（点「备忘」一起弹出） ----------
function ensureMarkTypes(){
  S.markTypes=S.markTypes||[];
  if(!S.markTypes.length){
    S.markTypes.push({id:'mk_r',name:'考试',color:'#ef4444'});
    S.markTypes.push({id:'mk_y',name:'实验',color:'#f59e0b'});
    S.markTypes.push({id:'mk_g',name:'生日',color:'#22c55e'});
  }
  // 兼容旧数据：r/y/g → 默认类别 id
  S.dayMarks=S.dayMarks||{};
  const map={r:'mk_r',y:'mk_y',g:'mk_g'};
  Object.keys(S.dayMarks).forEach(ds=>{
    const m=S.dayMarks[ds];
    if(m&&m.c&&map[m.c])m.c=map[m.c];

// ---------- 导出到 Obsidian（完整每日笔记，合并为单个 .md） ----------
function clTypeName(id){const t=(DEF_CL_TYPES||[]).find(x=>x.id===id);return t?t.name:id;}
function healthName(id){const m={good:'健康',fine:'良好',mid:'亚健康',bad:'不健康'};return m[id]||'';}
function weekdayCN(d){const w=new Date(d+'T00:00:00').getDay();return ['周日','周一','周二','周三','周四','周五','周六'][w];}
function annivDate(a,y){
  if(a.type==='once')return a.date||'';
  if(a.type==='year')return y+'-'+(a.date||'');
  if(a.type==='week'){
    const m=a.month,n=a.n,wd=a.wday;
    const first=new Date(y,m-1,1);
    const offset=((wd-first.getDay())%7+7)%7;
    let day=1+offset+(n-1)*7;
    if(n>=5){const last=new Date(y,m,0);const lo=((wd-last.getDay())%7+7)%7;day=last.getDate()-lo;}
    const maxDay=new Date(y,m,0).getDate();
    if(day>maxDay)day-=7; if(day<1)day+=7;
    return y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  }
  return '';
}
function yearsRange(set){
  let yrs=[];set.forEach(d=>{const y=parseInt(String(d).slice(0,4),10);if(!isNaN(y))yrs.push(y);});
  yrs=[...new Set(yrs)];
  if(!yrs.length)yrs=[new Date().getFullYear()];
  const min=Math.min.apply(null,yrs),max=Math.max.apply(null,yrs),r=[];
  for(let y=min;y<=max;y++)r.push(y);return r;
}
function allDates(){
  const set=new Set();const add=d=>{if(d)set.add(d);};
  (S.sleep||[]).forEach(x=>add(x.date));
  (S.meals||[]).forEach(x=>add(x.date));
  (S.waters||[]).forEach(x=>add(x.date));
  (S.exercise||[]).forEach(x=>add(x.date));
  (S.moneyRecords||[]).forEach(x=>add(x.date));
  (S.summaries||[]).forEach(x=>add(x.date));
  (S.habits||[]).forEach(h=>(h.doneDates||[]).forEach(add));
  (S.activity||[]).forEach(x=>{if(!x.autoSleep&&!x.autoEx)add(x.date);});
  (S.tasks||[]).forEach(x=>{if(x.assignedDate)add(x.assignedDate);if(x.doneDate)add(x.doneDate);});
  Object.keys(S.dayMarks||{}).forEach(add);
  return [...set].sort();
}
function buildObsidianMD(){
  const out=['---','tags: [自律小记]','---','','# 自律小记 · 每日日记','> 由「自律小记」App 导出 · 生成于 '+todayStr(),''];
  const dates=allDates();
  if(!dates.length)out.push('_暂无记录_');
  dates.forEach(d=>{out.push('# '+d+' '+weekdayCN(d));buildDay(d,out);out.push('');});
  buildGlobal(out);
  return out.join('\n');
}
function buildDay(d,out){
  // 1. 睡眠
  const sl=(S.sleep||[]).filter(x=>x.date===d);
  if(sl.length){out.push('## 睡眠');sl.forEach(x=>out.push('- 入睡 '+x.bed+' · 起床 '+x.wake+' · 约 '+((x.dur||0)/60).toFixed(1)+' 小时'));}
  // 2. 任务（短线完成/未完成 + 长线进度 + 长远目标写在最下面）
  const todayD=todayStr();
  const shortT=(S.tasks||[]).filter(t=>(t.type!=='long'||!t.longMode)&&((t.assignedDate===d)||(t.inToday&&d===todayD)||(t.doneDate===d)));
  const doneT=shortT.filter(t=>t.doneDate===d);
  const todoT=shortT.filter(t=>t.doneDate!==d);
  const longT=(S.tasks||[]).filter(t=>t.longMode&&((t.assignedDate===d)||(t.inToday&&d===todayD)||(t.doneDate===d)||(t.status==='active')));
  const goalsDone=(S.goals||[]).filter(g=>g.done);
  if(doneT.length||todoT.length||longT.length||goalsDone.length){
    out.push('## 任务');
    if(doneT.length){out.push('### 已完成');doneT.forEach(t=>out.push('- ✓ '+(t.title||'')));}
    if(todoT.length){out.push('### 未完成');todoT.forEach(t=>out.push('- ✗ '+(t.title||'')));}
    if(longT.length){out.push('### 长线任务（进度）');longT.forEach(t=>{const p=t.longMode==='count'?((t.progress||0)+'/'+(t.total||1)):((t.progress||0)+'%');out.push('- '+(t.status==='done'?'✓':'✗')+' '+(t.title||'')+'（进度 '+p+'）');});}
    if(goalsDone.length){out.push('### 长远目标');goalsDone.forEach(g=>out.push('- ✓ '+(g.text||'')));}
  }
  // 3. 时间轴活动表（起床 + 常用活动，按时间排序）
  const ev=[];
  sl.forEach(x=>{if(x.wake)ev.push({t:x.wake,k:'起床 '+x.wake});});
  (S.activity||[]).filter(x=>!x.autoSleep&&!x.autoEx&&x.date===d).forEach(x=>{const tn=(getTypes().find(t=>t.id===x.typeId)||{}).name||'';ev.push({t:x.start,k:x.start+'–'+x.end+' '+(x.title||'')+(tn?('（'+tn+'）'):'')+' '+(x.dur||0)+' 分钟'});});
  if(ev.length){ev.sort((a,b)=>a.t<b.t?-1:(a.t>b.t?1:0));out.push('## 时间轴活动表');ev.forEach(e=>out.push('- '+e.k));}
  // 4. 锻炼
  const ex=(S.exercise||[]).filter(x=>x.date===d);
  if(ex.length){out.push('## 锻炼');ex.forEach(x=>out.push('- '+x.start+'–'+x.end+' '+typeExById(x.typeId).name+'（'+(x.dur||0)+' 分钟）'));}
  // 5. 记账（不写时间）
  const mr=(S.moneyRecords||[]).filter(x=>x.date===d);
  if(mr.length){out.push('## 记账');let tot=0;mr.forEach(x=>{tot+=(x.amount||0);let s='- '+typeMoneyById(x.typeId).name+' ¥'+(x.amount||0).toFixed(2);if(x.note)s+='（'+x.note+'）';if(x.impulse)s+='［冲动］';out.push(s);});if(tot>0)out.push('- 合计 ¥'+tot.toFixed(2));}
  // 6. 饮食
  const meals=(S.meals||[]).filter(x=>x.date===d);
  const wv=(S.waters||[]).find(x=>x.date===d);
  if(meals.length||wv){
    out.push('## 饮食');
    ['breakfast','lunch','dinner'].forEach(k=>{const m=meals.find(x=>x.meal===k);if(!m)return;if(m.skip)out.push('- '+MEAL_NAMES[k]+'：未吃');else{let s='- '+MEAL_NAMES[k]+'：'+(m.text||'');const hn=healthName(m.health);if(hn)s+='（'+hn+'）';out.push(s);}});
    const wl=wv?WATER_LEVELS.find(v=>v.id===wv.level):null;
    out.push('- 饮水：'+(wl?wl.name:'未记录'));
  }
  // 7. 习惯打卡（含频率目标当天完成）
  const habits=(S.habits||[]);
  const good=habits.filter(h=>!h.bad&&h.kind!=='freq'&&(h.doneDates||[]).includes(d));
  const bad=habits.filter(h=>h.bad&&h.kind!=='freq'&&(h.doneDates||[]).includes(d));
  const freq=habits.filter(h=>h.kind==='freq'&&(h.doneDates||[]).includes(d));
  if(good.length||bad.length||freq.length){
    out.push('## 习惯打卡');
    good.forEach(h=>out.push('- ✓ '+h.name));
    bad.forEach(h=>out.push('- ✗ '+h.name+'（触犯）'));
    freq.forEach(h=>out.push('- ✓ '+h.name+'（频率目标）'));
  }
  // 8. 每日总结
  const su=(S.summaries||[]).find(x=>x.date===d);
  if(su&&su.text){out.push('## 每日总结');const mn=(SUMM_MOODS.find(m=>m.id===su.mood)||{}).name||'';if(mn)out.push('情绪：'+mn);su.text.split('\n').forEach(l=>out.push('> '+l));}
  // 9. 当日标记
  const dm=(S.dayMarks||{})[d];
  if(dm&&(dm.c||dm.n)){out.push('## 当日标记');if(dm.c){const t=(S.markTypes||[]).find(x=>x.id===dm.c);if(t)out.push('- 标记：'+t.name);}if(dm.n)out.push('- 备注：'+dm.n);}
}
function buildGlobal(out){
  out.push('---');
  out.push('## 其他（未绑定到具体某天）');
  const cl=(S.collects||[]);
  if(cl.length){out.push('### 收藏');cl.forEach(x=>out.push('- '+clTypeName(x.type)+'《'+(x.name||'')+'》'+(x.author?(' 作者：'+x.author):'')+(x.date?('（'+x.date+'）'):'')));}
  const ins=(S.inspirations||[]);
  if(ins.length){out.push('### 灵感库');ins.forEach(x=>out.push('- '+(x.text||'')));}
  const mm=(S.memos||[]);
  if(mm.length){out.push('### 备忘录');mm.forEach(x=>{const di=memoDueInfo(x);out.push('- '+(x.done?'[x] ':'[ ] ')+(x.text||'')+(x.due?('（截止：'+x.due+'，'+di.txt+'）'):''));});}
  const gl=(S.goals||[]);
  if(gl.length){out.push('### 长线任务');gl.forEach(x=>out.push('- '+(x.text||'')));}
}

// ---------- 每日笔记（一篇一文件，适配 Obsidian Daily Notes） ----------
function buildDayNote(d){
  const now=new Date();
  const p=n=>String(n).padStart(2,'0');
  const ts=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+' '+p(now.getHours())+':'+p(now.getMinutes());
  const out=['---','tags: [自律小记]','date: '+d,'time: '+ts,'---','','# '+d+' '+weekdayCN(d)];
  buildDay(d,out);
  // 灵感库放在最末尾（收藏/备忘不并进每日笔记）
  const ins=(S.inspirations||[]);
  if(ins.length){out.push('## 灵感库');ins.forEach(x=>out.push('- '+(x.text||'')));}
  return out.join('\n');
}
function yesterdayStr(){
  const t=new Date();t.setDate(t.getDate()-1);
  const p=n=>String(n).padStart(2,'0');
  return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());
}
// 把某天笔记推送到 Obsidian（obsidian://new，支持 overwrite 避免重复）
function syncDayToObsidian(d,silent){
  if(!d){if(!silent)alert('日期无效');return;}
  const note=buildDayNote(d);
  if(!note||note.replace(/[#\-\s>]/g,'')===''){if(!silent)alert('这一天还没有可导出的记录');return;}
  const ob=S.obsidian||{};
  const folder=(ob.folder||'Daily').replace(/\/+$/,'').replace(/^\/+/,'');
  const file=folder+'/'+d;
  let uri='obsidian://new?overwrite=true';
  if(ob.vault)uri+='&vault='+encodeURIComponent(ob.vault);
  uri+='&file='+encodeURIComponent(file);
  uri+='&content='+encodeURIComponent(note);
  if(encodeURI(uri).length>16000&&!silent)alert('内容较长，Obsidian 可能只收到部分。建议改用「复制全文」手动粘贴。');
  try{window.location.href=uri;}catch(e){}
  S.syncedDays=S.syncedDays||{};S.syncedDays[d]=1;save();
  if(!silent)setTimeout(function(){alert('已把「'+d+'」发送到 Obsidian\n如已安装会自动创建/更新笔记');},300);
}
// 过12点自动把「昨天」整理进 Obsidian（App 打开或驻留时触发）
function autoSyncCheck(){
  if(!(S.obsidian&&S.obsidian.auto))return;
  const today=todayStr();
  S.syncedDays=S.syncedDays||{};
  S.lastDaySeen=S.lastDaySeen||'';
  const y=yesterdayStr();
  if(S.lastDaySeen!==today){
    if(y&&!S.syncedDays[y]&&allDates().indexOf(y)>=0){
      S.lastDaySeen=today;save();
      syncDayToObsidian(y,true);
    }else{
      S.lastDaySeen=today;save();
    }
  }
}

  alert('已保存云同步设置'+(c.token?(c.gistId?'，Gist 已就绪':'，首次同步会自动创建私有 Gist'):'，请先填入 GitHub Token'));
}
// 某天是否有可导出的真实记录（避免推送空日记）
function dayHasData(d){
  if((S.sleep||[]).some(x=>x.date===d))return true;
  if((S.tasks||[]).some(t=>t.doneDate===d||t.assignedDate===d||(t.inToday&&d===todayStr())))return true;
  if((S.activity||[]).some(x=>x.date===d&&!x.autoSleep&&!x.autoEx))return true;
  if((S.exercise||[]).some(x=>x.date===d))return true;
  if((S.moneyRecords||[]).some(x=>x.date===d))return true;
  if((S.meals||[]).some(x=>x.date===d))return true;
  if((S.waters||[]).some(x=>x.date===d))return true;
  if((S.habits||[]).some(h=>(h.doneDates||[]).includes(d)))return true;
  if((S.summaries||[]).some(x=>x.date===d&&x.text))return true;
  const dm=(S.dayMarks||{})[d];
  if(dm&&(dm.c||dm.n))return true;
  return false;
}
// 把某天笔记推送到 GitHub 私有 Gist（自动创建/更新对应日期的 .md 文件）
function pushDayToGist(d,silent){
  const c=cloudCfg();
  if(!c.token){if(!silent)alert('请先在「设置 → 数据备份」里填入 GitHub Token');return false;}
  if(!d){if(!silent)alert('日期无效');return false;}
  if(!dayHasData(d)){if(!silent)alert('这一天还没有可导出的记录');return false;}
  const note=buildDayNote(d);
  const fname=d+'.md';
  const headers={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'};
  const body={description:'自律小记每日笔记',public:false,files:{}};
  body.files[fname]={content:note};
  let url='https://api.github.com/gists',method='POST';
  if(c.gistId){url+='/'+c.gistId;method='PATCH';}
  fetch(url,{method:method,headers:headers,body:JSON.stringify(body)})
  .then(r=>r.json().then(j=>({ok:r.ok,status:r.status,j:j})))
  .then(res=>{
    if(res.ok&&res.j&&res.j.id){
      c.gistId=res.j.id;c.pushed=c.pushed||{};c.pushed[d]=1;c.lastPushTs=Date.now();save();
      if(!silent)alert('已把「'+d+'」同步到云端\n电脑端定时脚本几分钟内会自动写入 Obsidian');
    }else{
      const msg=(res.j&&res.j.message)||('HTTP '+res.status);
      if(res.status===404){c.gistId='';save();}   // Gist 失效 → 下次重新创建
      if(!silent)alert('云同步失败：'+msg+'\n请检查 Token 是否有效（需 gist 权限）');
    }
  })
  .catch(e=>{if(!silent)alert('云同步失败：'+e.message+'\n请检查网络连接');});
  return true;
}
// 打开 App / 每分钟自动检查：只自动推送「前一天」（当天数据次日凌晨起自动整理，今天靠手动同步按钮）
function autoCloudCheck(){
  const c=cloudCfg();
  if(!(c.token&&c.auto))return;
  const y=yesterdayStr();
  c.pushed=c.pushed||{};
  if(y&&!c.pushed[y]&&dayHasData(y))pushDayToGist(y,true);
}

// 备忘录排序拖拽（浮起跟手 + 让位动画）：按住 ≡ → 卡片提起来跟随手指 → 松手落位
let mdrag=null;
const MEMO_ROW_H=56;
function mDown(e,i){
  if(!e.target.closest('.m-drag'))return;
  if(e.cancelable)e.preventDefault();
  const rows=document.querySelectorAll('#memoList .memo-item');
  const el=rows[i];
  if(!el)return;
  mdrag={i,startY:evY(e),offset:0,cur:i,el};
  el.style.zIndex='9';el.style.position='relative';el.style.transition='none';el.classList.add('drag');
}
function mMove(e){
  if(!mdrag)return;
  if(e.cancelable)e.preventDefault();
  const offset=evY(e)-mdrag.startY;
  mdrag.offset=offset;
  const rows=document.querySelectorAll('#memoList .memo-item');
  const list=S.memos;
  if(!list.length)return;
  const h=k=>((rows[k]&&rows[k].offsetHeight)||MEMO_ROW_H);
  let cur=mdrag.i,acc=offset;
  while(cur>0&&acc<-h(cur)/2){cur--;acc+=h(cur);}
  while(cur<list.length-1&&acc>h(cur+1)/2){cur++;acc-=h(cur+1);}
  mdrag.cur=cur;
  rows.forEach((r,k)=>{
    if(k===mdrag.i){r.style.transform='translateY('+offset+'px) scale(1.02)';return;}
    let sh=0;
    if(cur>mdrag.i&&k>mdrag.i&&k<=cur)sh=-h(k);
    if(cur<mdrag.i&&k>=cur&&k<mdrag.i)sh=+h(k);
    r.style.transform=sh?'translateY('+sh+'px)':'';
  });
}
function mUp(){
  if(!mdrag)return;
  const i=mdrag.i,cur=(mdrag.cur!==undefined?mdrag.cur:i);
  const list=S.memos;
  const target=Math.max(0,Math.min(list.length-1,cur));
  mdrag=null;
  if(target!==i){
    const [it]=list.splice(i,1);
    list.splice(target,0,it);
    save();
  }
  render();
}
function bindMemoDrag(){
  const els=document.querySelectorAll('#memoList .m-drag');
  els.forEach((el,i)=>{
    if(el.dataset.bound)return;
    el.dataset.bound='1';
    el.addEventListener('pointerdown',e=>mDown(e,i));
    el.addEventListener('touchstart',e=>mDown(e,i),{passive:false});
    el.addEventListener('mousedown',e=>mDown(e,i));
  });
}

function annivWeekDate(a,year){
  const fd=new Date(year,a.month-1,1).getDay();
  let day=1+((a.wday-fd)+7)%7;
  day+=(a.n-1)*7;
  return year+'-'+String(a.month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}
function annivOnDate(ds){
  const md=ds.slice(5), y=ds.slice(0,4);
  return (S.anniversaries||[]).find(a=>{
    if(a.type==='year')return a.date===md;
    if(a.type==='once')return a.date===ds;
    if(a.type==='week')return annivWeekDate(a,parseInt(y,10))===ds;
    return false;
  })||null;
}
function annivInfo(a){
  const t=todayStr();
  if(a.type==='year'){
    const thisYear=t.slice(0,4)+'-'+a.date;
    const target=thisYear>=t?thisYear:(parseInt(t.slice(0,4),10)+1)+'-'+a.date;
    const d=daysBetween(t,target);
    return {days:d,passed:false,label:d===0?'就是今天':('还有 '+d+' 天')};
  }
  if(a.type==='week'){
    const y=parseInt(t.slice(0,4),10);
    const thisYear=annivWeekDate(a,y);
    const target=thisYear>=t?thisYear:annivWeekDate(a,y+1);
    const d=daysBetween(t,target);
    return {days:d,passed:false,label:d===0?'就是今天':('还有 '+d+' 天')};
  }
  const d=daysBetween(t,a.date);
  if(d>=0)return {days:d,passed:false,label:d===0?'就是今天':('还有 '+d+' 天')};
  return {days:-d,passed:true,label:'已过 '+(-d)+' 天'};
}
function annivSortKey(a){
  const t=todayStr();
  if(a.type==='year'){const thisYear=t.slice(0,4)+'-'+a.date;const target=thisYear>=t?thisYear:(parseInt(t.slice(0,4),10)+1)+'-'+a.date;return daysBetween(t,target);}
  if(a.type==='week'){const y=parseInt(t.slice(0,4),10);const thisYear=annivWeekDate(a,y);const target=thisYear>=t?thisYear:annivWeekDate(a,y+1);return daysBetween(t,target);}
  const d=daysBetween(t,a.date);return d>=0?d:9999+d;
}

function durMin(bed,wake){
  const [bh,bm]=bed.split(':').map(Number);
  const [wh,wm]=wake.split(':').map(Number);
  if([bh,bm,wh,wm].some(isNaN)) return 0;
  let m=(wh*60+wm)-(bh*60+bm);
  if(m<=0) m+=24*60;
  return m;
}
function fmtDur(m){
  if(!m) return '-';
  const h=Math.floor(m/60), mm=m%60;
  return (h?h+'小时':'')+(mm?mm+'分':(h?'':'0分'));
}

// 睡眠图表：时间范围 17:00~次日15:00（22小时=1320分钟）
const SC_START=17*60;   // 17:00 = 1020 min
const SC_RANGE=22*60;   // 1320 min
function scPos(timeStr){
  const [h,m]=timeStr.split(':').map(Number);
  if(isNaN(h)||isNaN(m)) return 0;
  let t=h*60+m;
  if(t<SC_START) t+=24*60;  // 跨午夜处理
  return ((t-SC_START)/SC_RANGE)*100;
}

function shortDate(ds){
  const wd=new Date(ds+'T00:00:00').getDay();
  return ds.slice(5)+' 周'+['日','一','二','三','四','五','六'][wd];
}

function sleepColor(dur){return dur<360?'low':(dur>540?'high':'');}

// 折线图：近 N 天睡眠总时长（0~12h 刻度），缺失的天断开连线；绿色虚线=目标 8h，橙色虚线=平均
const SLEEP_GOAL=8*60;   // 目标睡眠时长 8 小时
function sleepLineSvg(days){
  const W=300,H=110,MAX=720;
  const R=days.length<=7?3.5:2.5;
  const pts=days.map(ds=>{
    const s=S.sleep.find(x=>x.date===ds);
    return s?{dur:s.dur,id:s.id}:null;
  });
  pts.forEach((p,i)=>{ if(p){p.x=(i/(days.length-1))*W; p.y=Math.max(0,Math.min(H,(1-Math.min(p.dur,MAX)/MAX)*H));} });
  let s='<svg class="lc-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  for(let d=0;d<=MAX;d+=180){
    const y=(1-d/MAX)*H;
    s+='<line class="grid" x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'"/>';
  }
  const gy=(1-SLEEP_GOAL/MAX)*H;
  s+='<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 4"/>';
  const durs=pts.filter(p=>p).map(p=>p.dur);
  if(durs.length){
    const avg=durs.reduce((a,b)=>a+b,0)/durs.length;
    const ay=(1-Math.min(avg,MAX)/MAX)*H;
    s+='<line x1="0" y1="'+ay+'" x2="'+W+'" y2="'+ay+'" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>';
  }
  let d='';
  for(let i=0;i<pts.length;i++){
    if(!pts[i]){d='';continue;}
    if(d==='')d='M'+pts[i].x.toFixed(1)+' '+pts[i].y.toFixed(1);
    else d+=' L'+pts[i].x.toFixed(1)+' '+pts[i].y.toFixed(1);
  }
  if(d)s+='<path d="'+d+'" fill="none" stroke="#5B82A6" stroke-width="2" stroke-linejoin="round"/>';
  pts.forEach(p=>{
    if(p){
      const col=p.dur<360?'#ef4444':(p.dur>540?'#22c55e':'#5B82A6');
      s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+R+'" fill="'+col+'" stroke="#fff" stroke-width="1.5" style="cursor:pointer" onclick="showSleep(\''+p.id+'\')"/>';
    }
  });
  s+='</svg>';
  return s;
}

// X 轴标签：7 天显示星期；30 天显示日号（每 3 天一个，今天恒显示）
function xLabels(days,d,dayNames){
  return days.map((ds,i)=>{
    if(days.length<=7){
      return '<div class="'+(ds===d?'on':'')+'">'+dayNames[new Date(ds+'T00:00:00').getDay()]+'</div>';
    }
    const vis=(i%3===0)||ds===d;
    return '<div class="'+(ds===d?'on':'')+'">'+(vis?parseInt(ds.slice(8),10):'')+'</div>';
  }).join('');
}

  html+='<div class="lc-x">'+xLabels(days,today,dayNames)+'</div></div>';

  }else if(!s0){
    html+='<div class="empty">还没有睡眠记录<br>点上方卡片里的「＋ 记录」开始</div>';

  return html;
}

// 精确调节时间（几时几分）：键盘输入 + 步进按钮辅助，解决移动端 time 控件难操作的问题
// 归一化时间输入为 HH:MM：支持 "7:30"、"0730"、"07:30"；不合法返回 null
function normTime(v){
  v=(v||'').trim();
  if(!v)return '';
  let h,m;
  if(v.indexOf(':')>=0){h=parseInt(v.split(':')[0],10);m=parseInt(v.split(':')[1],10);}
  else if(/^\d{3,4}$/.test(v)){h=parseInt(v.slice(0,-2),10);m=parseInt(v.slice(-2),10);}
  else return null;
  if(isNaN(h)||isNaN(m)||h<0||h>23||m<0||m>59)return null;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function timeStep(id,f,dir){
  const el=document.getElementById(id);if(!el)return;
  const nv=normTime(el.value);
  let h=nv?parseInt(nv.slice(0,2),10):0,m=nv?parseInt(nv.slice(3,5),10):0;
  if(f==='h')h=(h+dir+24)%24;else m=(m+dir+60)%60;
  el.value=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function timeStepBtns(id){
  return '<div class="tsb"><button type="button" onclick="timeStep(\''+id+'\',\'h\',-1)">时−</button><button type="button" onclick="timeStep(\''+id+'\',\'h\',1)">时+</button><button type="button" onclick="timeStep(\''+id+'\',\'m\',-1)">分−</button><button type="button" onclick="timeStep(\''+id+'\',\'m\',1)">分+</button></div>';
}

// 睡眠记录自动同步到活动「实际记录」：date=起床日（昨晚入睡→今早起床记在起床日）。
// 跨午夜时拆两段：入睡段(23:00-24:00)归前一天，起床段(00:00-07:00)归当天；按睡眠 id 整体重建
function syncSleepToAct(id,date,bed,wake){
  S.activity=S.activity||[];
  S.activity=S.activity.filter(a=>!(a.autoSleep && a.sleepId===id));
  const sMin=minOf(bed), eMin=minOf(wake);
  const segs=[];
  if(eMin>sMin){segs.push([sMin,eMin,date]);}
  else{segs.push([sMin,1440,shiftDate(date,-1)]);segs.push([0,eMin,date]);}
  segs.forEach(([a,b,dt])=>{
    if(b-a<15)return;
    S.activity.push({id:uid(),date:dt,start:fmtTime(a),end:fmtTime(b),title:'睡眠',typeId:'rest',autoSleep:true,autoDate:date,sleepId:id});
  });
}
function saveSleep(){
  const date=document.getElementById('sl_date').value||todayStr();
  const bed=normTime(document.getElementById('sl_bed').value);
  const wake=normTime(document.getElementById('sl_wake').value);
  if(!date||!bed||!wake){alert('请填写日期、入睡和起床时间（如 23:00）');return;}
  if(!bed||!wake){alert('时间格式应为 时:分，如 23:00');return;}
  const dur=durMin(bed,wake);
  S.sleep=S.sleep||[];
  const ex=S.sleep.find(x=>x.date===date && x.id!==(sleepEdit||null));
  let rec=null;
  if(ex){
    Object.assign(ex,{bed,wake,dur});
    if(sleepEdit) S.sleep=S.sleep.filter(x=>x.id!==sleepEdit);
    rec=ex;
  }else if(sleepEdit){
    const t=S.sleep.find(x=>x.id===sleepEdit);
    if(t) Object.assign(t,{date,bed,wake,dur});
    rec=t;
  }else{
    rec={id:uid(),date,bed,wake,dur};
    S.sleep.push(rec);
  }
  if(rec)syncSleepToAct(rec.id,date,bed,wake);   // 自动写入活动「实际记录」
  closeModal();save();render();
}
function delSleep(id){
  const s=S.sleep.find(x=>x.id===id);
  if(s)S.activity=(S.activity||[]).filter(a=>!(a.autoSleep && a.sleepId===id));  // 同步清理活动（含跨午夜两段）
  S.sleep=S.sleep.filter(x=>x.id!==id);save();render();
}

function caCard(a){

// 常用活动手势：滑动=滚动（放行）· 长按=拖拽 · 单击=编辑 · 快速双击=计时（均基于按下时间判定）
let cad=null;
let caSupress=false;    // 拖拽结束后吞掉随后的合成 click，避免误触发"单击编辑"
let caHoldTimer=null;   // 长按进入拖拽的定时器
let caTapT=0,caTapId='',caTapTimer=null;   // 单击编辑/双击计时判定
const CA_ROW_H=52;
const CA_HOLD_MS=350;   // 按住多久进入拖拽
const CA_SLIDE_PX=12;   // 手指移动超此距离=滚动意图，放弃拖拽
const CA_DOUBLE_MS=600; // 双击判定窗口（两次按下的间隔）
const CA_SINGLE_MS=600; // 单击编辑延迟（确认不是双击）
function caDown(e,i){
  // 一次物理点击会依次触发 pointerdown→touchstart→合成mousedown 三通道，只处理第一个，避免误判成"双击"
  if(e.type==='pointerdown')window.__caPointerDown=true;
  if(e.type==='touchstart'){
    window.__caTouchUsed=true;
    if(window.__caPointerDown){window.__caPointerDown=false;return;}
  }
  if(e.type==='mousedown'){
    if(window.__caTouchUsed){window.__caTouchUsed=false;return;}
    if('PointerEvent' in window)return;
  }
  if(!e.target.closest('.ca-card'))return;
  if(e.target.closest('.m-del')||e.target.closest('.ca-act'))return;
  const rows=document.querySelectorAll('#caList .ca-card');
  const el=rows[i];if(!el)return;
  const id=(S.commonActs||[])[i]&&(S.commonActs||[])[i].id;
  // 双击判定：基于按下时间间隔（手机上比 click 合成事件可靠得多）
  const now=Date.now();
  if(now-(window.__caDownLast||0)<120)return;   // 双保险：同一物理点击 120ms 内只处理一次
  window.__caDownLast=now;
  if(now-caTapT<CA_DOUBLE_MS && caTapId===id){
    caTapT=0;caTapId='';
    clearTimeout(caTapTimer);
    toggleTimer(id);
  }else{
    caTapT=now;caTapId=id;
    clearTimeout(caTapTimer);
    caTapTimer=setTimeout(()=>{caTapT=0;caTapId='';if(!cad||!cad.active)showCommonAct(id);},CA_SINGLE_MS);
  }
  cad={i,startX:evX(e),startY:evY(e),offsetX:0,offsetY:0,active:false,slid:false,cur:i,el};
  clearTimeout(caHoldTimer);
  caHoldTimer=setTimeout(()=>{
    if(!cad||cad.active||cad.slid)return;
    cad.active=true;
    cad.el.style.zIndex='9';cad.el.style.position='relative';cad.el.style.transition='none';cad.el.classList.add('drag');
    clearTimeout(caTapTimer);   // 已进入拖拽，取消待定的"单击编辑"
  },CA_HOLD_MS);
}
// 双向拖拽（上下左右）：2 列网格，纵向按行、横向过半格换列，目标索引实时更新让位
function caMove(e){
  if(!cad)return;
  const ox=evX(e)-cad.startX, oy=evY(e)-cad.startY;
  cad.offsetX=ox;cad.offsetY=oy;
  if(!cad.active){
    // 未激活：手指移动超阈值 → 判定为滚动/滑动，放弃长按拖拽并完全放行页面滚动
    if(Math.abs(ox)>CA_SLIDE_PX||Math.abs(oy)>CA_SLIDE_PX){
      cad.slid=true;
      clearTimeout(caHoldTimer);
      clearTimeout(caTapTimer);   // 滑动不弹编辑
      caTapT=0;caTapId='';
    }
    return;   // 绝不 preventDefault，页面正常滚动
  }
  if(e.cancelable)e.preventDefault();
  const rows=document.querySelectorAll('#caList .ca-card');
  const list=S.commonActs||[];
  if(!list.length)return;
  const h=k=>((rows[k]&&rows[k].offsetHeight)||CA_ROW_H);
  const COLS=2;
  const R=Math.max(1,Math.ceil(list.length/COLS));
  const r0=Math.floor(cad.i/COLS), c0=cad.i%COLS;
  let dr=Math.round(oy/h(cad.i));
  const w=(rows[cad.i]&&rows[cad.i].offsetWidth)||120;
  let dc=0;
  if(ox>w/2)dc=1;else if(ox<-w/2)dc=-1;
  let r=Math.max(0,Math.min(R-1,r0+dr));
  let c=Math.max(0,Math.min(COLS-1,c0+dc));
  let target=Math.min(list.length-1,Math.max(0,r*COLS+c));
  cad.cur=target;
  rows.forEach((rr,k)=>{
    if(k===cad.i){rr.style.transform='translate('+ox+'px,'+oy+'px) scale(1.02)';return;}
    let sh=0;
    if(target>cad.i&&k>cad.i&&k<=target)sh=-h(k);
    if(target<cad.i&&k>=target&&k<cad.i)sh=+h(k);
    rr.style.transform=sh?'translateY('+sh+'px)':'';
  });
}
function caUp(){
  if(!cad)return;
  clearTimeout(caHoldTimer);
  const moved=cad.active;
  if(moved){
    const i=cad.i,cur=(cad.cur!==undefined?cad.cur:i);
    const list=S.commonActs||[];
    const target=Math.max(0,Math.min(list.length-1,cur));
    if(target!==i){
      const [it]=list.splice(i,1);
      list.splice(target,0,it);
      save();
    }
    caSupress=true;    // 吞掉拖拽后的合成 click
  }
  cad=null;
  render();
}
function bindCaDrag(){
  document.querySelectorAll('#caList .ca-card').forEach((el,i)=>{
    if(el.dataset.bound)return;
    el.dataset.bound='1';
    // 只绑一个通道：一次物理点击只触发一次判定，杜绝 pointerdown/touchstart/合成mousedown 重复误判
    if(window.PointerEvent)el.addEventListener('pointerdown',e=>caDown(e,i));
    else{el.addEventListener('touchstart',e=>caDown(e,i),{passive:false});el.addEventListener('mousedown',e=>caDown(e,i));}
  });
}
// 单击编辑 / 双击计时已在按下(caDown)时判定；此处仅吞掉拖拽后的合成 click
function bindCaCard(){
  document.querySelectorAll('#caList .ca-card').forEach(el=>{
    if(el.dataset.bound2)return;

function fmtLast(ts){
  const d=new Date(ts);
  const pad=n=>String(n).padStart(2,'0');
  const ymd=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const hm=pad(d.getHours())+':'+pad(d.getMinutes());
  const t=todayStr();
  if(ymd===t)return '今天 '+hm;
  const yd=new Date(Date.now()-86400000);
  const ymd2=yd.getFullYear()+'-'+pad(yd.getMonth()+1)+'-'+pad(yd.getDate());
  if(ymd===ymd2)return '昨天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}
function toggleTimer(id){
  if(actT&&actT.id===id){stopTimer();return;}
  startTimer(id);
}
function tickTimer(){
  if(!actT)return;
  const t=Math.max(1,Math.round((Date.now()-actT.startTs)/60000));
  const el=document.getElementById('act-live-'+actT.id);
  if(el)el.textContent=fmtDur(t);
  const tv=document.getElementById('td-timer-v');

}
function startTimer(id){
  const a=(S.commonActs||[]).find(x=>x.id===id);
  if(!a)return;
  actT={id,startTs:Date.now()};
  try{localStorage.setItem('sd_actT',JSON.stringify(actT));}catch(e){}
  render();
  clearInterval(actTimerInt);
  actTimerInt=setInterval(tickTimer,1000);
}
function stopTimer(){
  if(!actT)return;
  const a=(S.commonActs||[]).find(x=>x.id===actT.id);
  const dur=Math.max(1,Math.round((Date.now()-actT.startTs)/60000));
  const st=new Date(actT.startTs),en=new Date();
  const pad=n=>String(n).padStart(2,'0');
  if(a){a.last=Date.now();a.lastDur=dur;}
  S.activity=S.activity||[];
  S.activity.push({id:uid(),date:todayStr(),start:pad(st.getHours())+':'+pad(st.getMinutes()),end:pad(en.getHours())+':'+pad(en.getMinutes()),dur,title:a?a.name:'',typeId:a?(a.typeId||'other'):'other'});
  clearInterval(actTimerInt);actTimerInt=null;actT=null;
  try{localStorage.removeItem('sd_actT');}catch(e){}
  save();render();
}
// 恢复后台/被杀后的计时：启动时若有 sd_actT 则继续计时（基于时间戳，时长准确）
function restoreActTimer(){
  try{
    const raw=localStorage.getItem('sd_actT');
    if(!raw)return;
    const o=JSON.parse(raw);
    if(!o||!o.id)return;
    const a=(S.commonActs||[]).find(x=>x.id===o.id);
    if(!a){localStorage.removeItem('sd_actT');return;}
    actT={id:o.id,startTs:o.startTs||Date.now()};
    clearInterval(actTimerInt);
    actTimerInt=setInterval(tickTimer,1000);
  }catch(e){}
}

function typeById(id){return getTypes().find(t=>t.id===id)||DEF_TYPES[DEF_TYPES.length-1];}
function minOf(t){const p=t.split(':').map(Number);return (isNaN(p[0])?0:p[0]*60)+(isNaN(p[1])?0:p[1]);}
function fmtTime(m){const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function shiftDate(ds,n){
  const d=new Date(ds+'T00:00:00');
  d.setDate(d.getDate()+n);
  const o=d.getTimezoneOffset()*60000;
  return new Date(d-o).toISOString().slice(0,10);
}

function evY(e){return (e.touches&&e.touches[0])?e.touches[0].clientY:e.clientY;}
function evX(e){return (e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX;}
function y2m(y,rect){return Math.max(0,Math.min(1440,Math.round(((y-rect.top)/rect.height)*1440/15)*15));}
function actPDown(e,side){
  if(!editMode)return;
  if(e.cancelable)e.preventDefault();
  const rect=e.currentTarget.getBoundingClientRect();
  const y=evY(e);
  drag={side,rect,y1:y2m(y,rect),y2:y2m(y,rect)};
  showPrev();
}
function actPMove(e){
  if(!drag)return;

  drag.y2=y2m(evY(e),drag.rect);

}
function actPUp(e){
  if(!drag)return;

  drag=null;
  hidePrev();

  dragRange={side,start:fmtTime(a),end:fmtTime(b)};

}

// 渲染后绑定：每侧列绑定 down 事件（三通道），窗口绑定 move/up

}

// ---------- 习惯打卡（每日好/坏习惯 + 频率目标） ----------
// 连续打卡天数：今天已打→从今天往前数；今天没打→从昨天往前数；中断即停
function habitStreak(h){
  let cur=0;
  const d=new Date();
  if(!(h.doneDates||[]).includes(todayStr()))d.setDate(d.getDate()-1);
  for(let i=0;i<400;i++){
    const o=d.getTimezoneOffset()*60000;
    const s=new Date(d-o).toISOString().slice(0,10);
    if((h.doneDates||[]).includes(s)){cur++;d.setDate(d.getDate()-1);}
    else break;
  }
  return cur;
}
// 坏习惯：连续未触犯天数（从昨天往前，触犯日中断）
function badStreak(h){
  if((h.doneDates||[]).includes(todayStr()))return 0;
  let cur=0;
  const d=new Date();
  d.setDate(d.getDate()-1);
  for(let i=0;i<365;i++){
    const o=d.getTimezoneOffset()*60000;
    const s=new Date(d-o).toISOString().slice(0,10);
    if(!(h.doneDates||[]).includes(s)){cur++;d.setDate(d.getDate()-1);}
    else break;
  }
  return cur;
}
// 频率习惯：当前周期(自然周/自然月)内已完成次数
function freqCount(h){
  const ds=todayStr();
  if(h.period==='month'){
    const p=ds.slice(0,7);
    return (h.doneDates||[]).filter(x=>x.startsWith(p)).length;
  }
  const dow=(new Date().getDay()+6)%7;   // 0=周一
  const mon=shiftDate(ds,-dow);
  return (h.doneDates||[]).filter(x=>x>=mon&&x<=ds).length;
}
let habitSub='daily';   // 习惯模块子视图：'daily' 日常打卡 | 'year' 年视图
let yvHabit='';         // 年视图选中的习惯 id

  if(habitSub==='year')return html+renderHabitYear();
  const d=habitDate||todayStr();
  const daily=S.habits.filter(h=>h.kind!=='freq');
  const freq=S.habits.filter(h=>h.kind==='freq');
  // 日期切换条（月历跳转可看那一天习惯完成情况）
  html+='<div class="actbar">';

    html+='<div class="hg">'+daily.map(h=>hcard(h,d)).join('')+'</div>';

// 习惯年视图：365 格（7 行周 × 周数列），打卡日染绿，底部年度统计
function renderHabitYear(){
  const habits=(S.habits||[]).slice();
  if(!habits.length)return '<div class="empty">还没有习惯<br>先建一个习惯再看年视图</div>';
  if(!yvHabit||!habits.find(x=>x.id===yvHabit))yvHabit=habits[0].id;
  const h=habits.find(x=>x.id===yvHabit);
  const year=new Date().getFullYear();
  const today=todayStr();
  const pad=x=>String(x).padStart(2,'0');
  const daysInYear=((year%4===0&&year%100!==0)||year%400===0)?366:365;
  let s='<div class="actbar">'+habits.map(x=>'<button class="chip '+(x.id===yvHabit?'on':'')+'" onclick="yvHabit=\''+x.id+'\';render()">'+esc(x.name)+'</button>').join('')+'</div>';
  s+='<div class="yv-wrap"><div class="yv-title">'+year+' 年 · '+esc(h.name)+'</div>';
  // 365 格热力图（每月 2 排 × 16 列，显式定位行列，空位留空、不写日期数字）
  // 好习惯：打卡=绿；坏习惯：未触犯=白、触犯=红
  const touched=new Set((h.doneDates||[]).filter(x=>x.startsWith(String(year))));
  const cellCls=ds=>{
    if(h.bad)return touched.has(ds)?' bad':' blank';
    return touched.has(ds)?' on':'';
  };
  let grid='<div class="yv-grid">';
  for(let m=1;m<=12;m++){
    const dim=new Date(year,m,0).getDate();
    const r1=m*2-1,r2=m*2;
    grid+='<div class="yv-month" style="grid-row:'+r1+';grid-column:1">'+m+'月</div>';
    for(let d=1;d<=16;d++){
      if(d>dim)continue;
      const ds=year+'-'+pad(m)+'-'+pad(d);
      grid+='<div class="yv-cell'+cellCls(ds)+(ds===today?' today':'')+'" style="grid-row:'+r1+';grid-column:'+(d+1)+'" title="'+ds+'"></div>';
    }
    grid+='<div class="yv-month" style="grid-row:'+r2+';grid-column:1"></div>';
    for(let d=17;d<=31;d++){
      if(d>dim)continue;
      const ds=year+'-'+pad(m)+'-'+pad(d);
      grid+='<div class="yv-cell'+cellCls(ds)+(ds===today?' today':'')+'" style="grid-row:'+r2+';grid-column:'+(d-15)+'" title="'+ds+'"></div>';
    }
  }
  grid+='</div>';
  s+=grid;
  // 年度统计
  const now=new Date();
  const elapsed=Math.min(daysInYear,Math.round((now-new Date(year,0,1))/86400000)+1);
  const checked=h.bad?Math.max(0,elapsed-touched.size):touched.size;
  const rate=Math.round(checked/elapsed*100);
  const streak=h.bad?badStreak(h):habitStreak(h);
  s+='<div class="yv-stats"><div><b>'+checked+'/'+daysInYear+'</b>'+(h.bad?'未触犯':'已打卡')+'</div><div><b>'+streak+'</b>连续'+(h.bad?'未触犯':'天数')+'</div><div><b>'+rate+'%</b>打卡率</div></div>';
  if(h.bad)s+='<div class="yv-legend"><i class="yvl blank"></i>未触犯<i class="yvl bad"></i>触犯<i class="yvl td"></i>今天</div>';
  else s+='<div class="yv-legend"><i class="yvl off"></i>未打卡<i class="yvl on"></i>打卡日<i class="yvl td"></i>今天</div>';
  s+='</div>';
  return s;
}
// 频率习惯按指定日期所在周期统计（查看历史日期用）
function freqCountAt(h,ds){
  if(h.period==='month')return (h.doneDates||[]).filter(x=>x.startsWith(ds.slice(0,7))).length;
  const dow=(new Date(ds+'T00:00:00').getDay()+6)%7;
  const mon=shiftDate(ds,-dow);
  return (h.doneDates||[]).filter(x=>x>=mon&&x<=ds).length;
}
function hcard(h,vd){
  const today=todayStr();
  const d=vd||today;
  const touched=(h.doneDates||[]).includes(d);
  const edit='<span class="edit" onclick="event.stopPropagation();showHabit(\''+h.id+'\')">✎</span>';
  const db=d===today?('toggleHabit(\''+h.id+'\')'):'alert(\'只能为今天打卡\')';
  if(h.kind==='freq'){
    const c=freqCountAt(h,d);
    const pct=Math.min(100,Math.round(c/(h.target||1)*100));
    return '<div class="hcard freq" ondblclick="'+db+'">'+edit+'<div class="nm">'+esc(h.name)+'</div><div class="hbar"><i style="width:'+pct+'%"></i></div><div class="st">'+(h.period==='month'?'本月':'本周')+' '+c+'/'+(h.target||0)+' 次</div></div>';
  }
  if(h.bad){
    const s=badStreak(h);
    return '<div class="hcard bad'+(touched?' touch':'')+'" ondblclick="'+db+'">'+edit+'<div class="nm">'+esc(h.name)+'</div><div class="st">'+(d===today?(touched?'已触犯':'连续 '+s+' 天未触犯'):(touched?'当天已触犯':'当天未触犯'))+'</div></div>';
  }
  const s=habitStreak(h);
  return '<div class="hcard good'+(touched?' done':'')+'" ondblclick="'+db+'">'+edit+'<div class="nm">'+esc(h.name)+'</div><div class="st">'+(d===today?(touched?'已打卡 · 连续 '+Math.max(s,1)+' 天':'连续 '+s+' 天'):(touched?'当天已打卡':'当天未打卡'))+'</div></div>';
}
function toggleHabit(id){
  const h=S.habits.find(x=>x.id===id);
  if(!h)return;
  h.doneDates=h.doneDates||[];
  const d=todayStr();
  const i=h.doneDates.indexOf(d);
  if(i>=0)h.doneDates.splice(i,1);else h.doneDates.push(d);

}

// ---- 一周情况视图（堆叠柱状图：每根柱子按运动类型分色） ----
function exStackSvg(days){
  const all=S.exercise||[];
  const maxDay=Math.max(1,...days.map(ds=>all.filter(x=>x.date===ds).reduce((s,x)=>s+(x.dur||0),0)));
  const MAX=Math.ceil(maxDay/30)*30||60;
  const W=320,H=190,top=14,bottom=164;
  const plotH=bottom-top;
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="ex-svg">';
  for(let k=0;k<=2;k++){
    const y=bottom-(k/2)*plotH;
    s+='<line x1="28" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#eceef1" stroke-width="1"/>';
    s+='<text x="24" y="'+(y+3)+'" text-anchor="end" font-size="10" fill="#9ca3af">'+(k===2?MAX:(k===1?Math.round(MAX/2):0))+'分</text>';
  }
  const bw=20;
  const dnames=['日','一','二','三','四','五','六'];
  days.forEach((ds,i)=>{
    const x=40+i*40;
    const items=all.filter(v=>v.date===ds);
    const total=items.reduce((s2,v)=>s2+(v.dur||0),0);
    if(total){
      const map={};
      items.forEach(v=>{map[v.typeId]=(map[v.typeId]||0)+(v.dur||0);});
      let acc=0;
      getExTypes().forEach(t=>{
        const d=map[t.id];
        if(!d)return;
        const hh=d/MAX*plotH;
        s+='<rect x="'+x+'" y="'+(bottom-acc-hh)+'" width="'+bw+'" height="'+hh+'" fill="'+t.color+'" rx="2"/>';
        acc+=hh;
      });
      s+='<rect x="'+(x-2)+'" y="'+top+'" width="'+(bw+4)+'" height="'+plotH+'" fill="transparent" style="cursor:pointer" onclick="showExDay(\''+ds+'\')"/>';
    }
    s+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#9ca3af">'+dnames[new Date(ds+'T00:00:00').getDay()]+'</text>';
  });
  s+='</svg>';
  const weekTotal=all.filter(x=>days.includes(x.date)).reduce((s2,x)=>s2+(x.dur||0),0);
  return {html:s,weekTotal};
}
function renderExWeek(){
  const days=[];
  for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);const o=x.getTimezoneOffset()*60000;days.push(new Date(x-o).toISOString().slice(0,10));}
  const st=exStackSvg(days);
  let h='<div class="ex-chart"><div class="ex-ctitle">近 7 天锻炼时长 · 堆叠=类型占比</div>';
  h+=st.html;
  h+='<div class="ex-cfoot">点柱子查看当天明细</div></div>';
  const month=todayStr().slice(0,7);
  const mAll=(S.exercise||[]).filter(x=>x.date.startsWith(month));
  const mTot=mAll.reduce((s,x)=>s+(x.dur||0),0);
  const mMap={};
  mAll.forEach(x=>{mMap[x.typeId]=(mMap[x.typeId]||0)+(x.dur||0);});
  h+='<div class="ex-chart"><div class="ex-ctitle">类型占比（本月累计）</div><div class="ex-stats">';
  if(mTot>0){
    getExTypes().forEach(t=>{

      h+='<div class="ex-st"><i style="background:'+t.color+'"></i>'+esc(t.name)+' '+pct+'%</div>';
    });
  }else{

  }
  h+='</div></div>';
  h+='<div class="ex-total"><div class="l">本周合计</div><div class="v">'+fmtDur(st.weekTotal)+'</div><div class="s">'+(st.weekTotal?'平均每天 '+fmtDur(Math.round(st.weekTotal/7)):'这周还没动起来')+'</div></div>';

// 锻炼自动同步到活动「实际记录」：清掉相关日期的 autoEx 条目后，为该日全部锻炼重建色块
function syncExToAct(date,oldDate){
  S.activity=S.activity||[];
  S.activity=S.activity.filter(a=>!(a.autoEx && (a.autoDate===date||a.autoDate===oldDate)));
  (S.exercise||[]).filter(x=>x.date===date).forEach(x=>{
    const t=typeExById(x.typeId);
    const sMin=minOf(x.start), eMin=minOf(x.end);
    if(eMin<=sMin||eMin-sMin<15)return;
    S.activity.push({id:uid(),date,start:x.start,end:x.end,title:t.name,typeId:'sport',autoEx:true,autoDate:date});
  });
}
